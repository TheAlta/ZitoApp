<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZITO | Z Generation Intelligent</title>

  <link href="https://cdn.jsdelivr.net/gh/hemedani/yekan@v3.0.0/font-face.css" rel="stylesheet" type="text/css">
  <link rel="preload" href="/landing-static/zito-ambient.mp3" as="audio" type="audio/mpeg">
  <script src="/landing-static/ambient-audio.js"></script>
  <script defer src="/landing-static/zito-mascot.js"></script>
  <script defer src="/landing-static/zito-intro-mascot.js"></script>

  <style>
    :root {
      /* رنگ‌های پس‌زمینه گرادیان */
      --bg-top: #010721;
      /* رنگ بالای صفحه (هماهنگ با لوگو) */
      --bg-avatar: #01081b;
      /* رنگ محدوده آواتار */
      --bg-bottom: #03081b;
      /* رنگ پایین صفحه (هماهنگ با آواتار) */

      --purple: #7d40ff;
      --blue: #3069ff;
      --ink: #ffffff;
      --font-yekan: 'Yekan', "YekanZito", "Yekan Bakh", "IRANYekan", "B Yekan", Tahoma, Arial, sans-serif;
      --font-fa: var(--font-yekan);
      --font-en: var(--font-yekan);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    button,
    input,
    textarea,
    select {
      font-family: var(--font-yekan);
    }

    body * {
      font-family: inherit;
    }

    html,
    body {
      height: 100vh;
      width: 100vw;
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-yekan);
      color: var(--ink);
      /* تغییر پس‌زمینه به گرادیان از بالا به پایین */
      background:
        linear-gradient(
          180deg,
          var(--bg-top) 0%,
          var(--bg-top) 22%,
          #01071f 38%,
          var(--bg-avatar) 58%,
          var(--bg-avatar) 76%,
          var(--bg-bottom) 100%
        );
      min-height: 100vh;
      width: 100vw;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,0.16) 0 1px, transparent 2px),
        radial-gradient(circle at 72% 24%, rgba(255,255,255,0.14) 0 1px, transparent 2px),
        radial-gradient(circle at 44% 72%, rgba(255,255,255,0.12) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 68%, rgba(255,255,255,0.11) 0 1px, transparent 2px);
      background-size: 220px 220px, 260px 260px, 300px 300px, 280px 280px;
      animation: spaceDrift 20s linear infinite;
      opacity: 0.35;
    }

    body::after {
      background:
        radial-gradient(circle at 28% 24%, rgba(255,255,255,0.08) 0, transparent 35%),
        radial-gradient(circle at 78% 64%, rgba(255,255,255,0.06) 0, transparent 42%);
      filter: blur(30px);
      animation: spaceGlow 10s ease-in-out infinite alternate;
      opacity: 0.38;
    }

    @keyframes spaceDrift {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(-3%, 2%, 0) scale(1.04);
      }
    }

    @keyframes spaceGlow {
      from {
        transform: scale(0.96);
        opacity: 0.28;
      }

      to {
        transform: scale(1.04);
        opacity: 0.42;
      }
    }

    .nunito-regular {
      font-family: var(--font-yekan);
      font-optical-sizing: auto;
      font-weight: 200;
      font-style: normal;
    }

    .noto-sans-arabic-regular {
      font-family: var(--font-yekan);
      font-optical-sizing: auto;
      font-weight: 100;
      font-style: normal;
      font-variation-settings:
        "wdth" 100;
    }

    /* ---------- ستاره‌ها ---------- */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.6;
      animation: twinkle 3.5s ease-in-out infinite;
    }

    .ambient-stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.95;
    }

    .ambient-star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.35);
      animation: softPulse 5s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .galaxy-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.7;
    }

    .galaxy-glow .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(26px);
      opacity: 0.28;
      animation: driftGlow 16s ease-in-out infinite alternate;
    }

    .galaxy-glow .orb.one {
      width: 320px;
      height: 320px;
      left: -8%;
      top: -6%;
      background: radial-gradient(circle, rgba(125, 64, 255, 0.48) 0%, rgba(125, 64, 255, 0) 70%);
    }

    .galaxy-glow .orb.two {
      width: 260px;
      height: 260px;
      right: -6%;
      top: 18%;
      background: radial-gradient(circle, rgba(48, 105, 255, 0.42) 0%, rgba(48, 105, 255, 0) 72%);
      animation-duration: 18s;
    }

    .galaxy-glow .orb.three {
      width: 220px;
      height: 220px;
      left: 20%;
      bottom: -8%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
      animation-duration: 20s;
    }

    .meteor-field {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .meteor {
      position: absolute;
      left: var(--start-x);
      top: var(--start-y);
      width: var(--meteor-size, 88px);
      height: var(--meteor-size, 88px);
      border-radius: 999px;
      background:
        radial-gradient(circle at 68% 42%, rgba(255, 255, 255, 0.92) 0 4%, rgba(182, 224, 255, 0.46) 5% 12%, transparent 24%),
        radial-gradient(circle at 42% 56%, rgba(139, 104, 255, 0.36), transparent 46%),
        radial-gradient(circle, rgba(72, 127, 255, 0.18), transparent 68%);
      filter: blur(0.2px);
      box-shadow:
        0 0 18px rgba(128, 174, 255, 0.26),
        0 0 44px rgba(124, 81, 255, 0.14);
      opacity: 0;
      transform: translate3d(-12vw, 8vh, 0) scale(0.72) rotate(var(--tilt, -8deg));
      animation: meteorTrail var(--duration, 11s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .meteor::before {
      content: '';
      position: absolute;
      right: 58%;
      top: 50%;
      width: 128%;
      height: 34%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(101, 141, 255, 0.16), rgba(179, 231, 255, 0.04));
      filter: blur(10px);
      transform: translateY(-50%) rotate(-9deg);
      transform-origin: right center;
    }

    .meteor::after {
      content: '';
      position: absolute;
      inset: 28%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.82);
      box-shadow:
        0 0 12px rgba(255, 255, 255, 0.88),
        0 0 26px rgba(100, 170, 255, 0.46),
        0 0 48px rgba(137, 78, 255, 0.24);
      animation: cosmicBlink 2.8s ease-in-out infinite;
    }

    @keyframes meteorTrail {
      0% {
        opacity: 0;
        transform: translate3d(-12vw, 8vh, 0) scale(0.72) rotate(var(--tilt, -8deg));
      }

      12% {
        opacity: 0.42;
      }

      48% {
        opacity: 0.82;
        transform: translate3d(var(--float-x, 38vw), var(--float-y, 20vh), 0) scale(1) rotate(calc(var(--tilt, -8deg) + 8deg));
      }

      82% {
        opacity: 0.28;
      }

      100% {
        opacity: 0;
        transform: translate3d(82vw, var(--end-y, 46vh), 0) scale(0.74) rotate(calc(var(--tilt, -8deg) + 18deg));
      }
    }

    @keyframes cosmicBlink {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.86);
      }

      50% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: .15;
        transform: scale(1);
      }

      50% {
        opacity: .9;
        transform: scale(1.4);
      }
    }

    @keyframes softPulse {
      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.9);
      }

      50% {
        opacity: 0.9;
        transform: scale(1.3);
      }
    }

    @keyframes driftGlow {
      from {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 0.2;
      }

      to {
        transform: translate3d(2%, -2%, 0) scale(1.08);
        opacity: 0.35;
      }
    }

    .sparkle-big {
      position: absolute;
      z-index: 1;
      opacity: .8;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.6);
    }

    .s1 {
      top: 12%;
      left: 22%;
    }

    .s2 {
      top: 15%;
      right: 20%;
    }

    /* ---------- برند ---------- */
    .brand {
      position: relative;
      z-index: 5;
      margin-top: 6vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: none;
    }

    /* درخشش لوگو حذف شد تا پس‌زمینه‌ی عکس معلوم نشه */
    .logo-img {
      width: 130px;
      height: auto;
      display: block;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .wordmark-zito {
      margin-top: -5px;
      font-family: var(--font-en);
      font-weight: 800;
      font-size: 40px;
      letter-spacing: 6px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .sub-en {
      margin-top: 6px;
      font-family: var(--font-fa);
      font-weight: 400;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.7);
      max-width: 220px;
    }

    /* ---------- آواتار ---------- */
    .avatar-wrap {
      position: absolute;
      bottom: 32vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: block;
    }

    /* ---------- چت‌باکس (سمت چپ، رو به دهان زیتو) ---------- */
    .chat-bubble {
      position: absolute;
      --bubble-fill: rgba(10, 10, 30, 0.9);
      left: auto;
      right: calc(50% + 52px);
      bottom: 37vh;
      transform: translateY(0);
      z-index: 4;
      max-width: 210px;
      min-width: 180px;
      background: var(--bubble-fill);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(138, 107, 255, 0.4);
      border-radius: 16px 16px 16px 4px;
      padding: 14px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: opacity .6s ease, transform .6s ease;
    }

    .chat-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }

    .chat-bubble::after {
      content: '';
      position: absolute;
      bottom: 16px;
      right: -16px;
      left: auto;
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 0;
      border-left: 16px solid var(--bubble-fill);
      filter: drop-shadow(2px 1px 3px rgba(0, 0, 0, 0.28));
    }

    .chat-name {
      font-family: var(--font-fa);
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      direction: rtl;
      text-align: right;
    }

    .chat-name .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    .chat-text {
      font-family: var(--font-fa);
      font-size: 13px;
      line-height: 1.8;
      color: #fff;
      min-height: 60px;
      direction: rtl;
      unicode-bidi: plaintext;
      letter-spacing: 0;
      word-spacing: normal;
      font-kerning: normal;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      text-align: right;
    }

    .typed-copy {
      direction: rtl;
      unicode-bidi: plaintext;
      white-space: normal;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 13px;
      background: #fff;
      margin-right: 2px;
      vertical-align: middle;
      animation: blink .9s step-start infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* ---------- دکمه ---------- */
    .cta-wrap {
      position: absolute;
      bottom: 4vh;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      justify-content: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .6s ease, transform .6s ease;
      pointer-events: none;
    }

    .cta-wrap.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .cta {
      font-family: var(--font-fa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      border: none;
      padding: 16px 48px;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(to right, #a733f5 0%, #2059e6 100%);
      box-shadow: 0 8px 26px rgba(56, 99, 253, 0.4), 0 0 40px rgba(48, 105, 255, 0.1);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .cta:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(48, 141, 255, 0.6);
    }

    .cta:active {
      transform: translateY(0px) scale(.98);
    }

    .phone-modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(1, 5, 18, 0.66);
      backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease;
    }

    .phone-modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .phone-card {
      width: min(410px, 100%);
      border: 1px solid rgba(138, 107, 255, 0.42);
      border-radius: 26px;
      padding: 22px;
      background:
        radial-gradient(circle at 80% 0%, rgba(125, 64, 255, 0.22), transparent 42%),
        rgba(8, 13, 38, 0.92);
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.46), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform: translateY(14px) scale(.98);
      transition: transform .28s ease;
    }

    .phone-modal.show .phone-card {
      transform: translateY(0) scale(1);
    }

    .phone-title {
      font-family: var(--font-fa);
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 8px;
      text-align: center;
    }

    .phone-copy {
      font-family: var(--font-fa);
      color: rgba(255,255,255,.72);
      font-size: 13px;
      line-height: 2;
      text-align: center;
      margin-bottom: 18px;
    }

    .phone-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
      direction: rtl;
    }

    .phone-form.is-hidden {
      display: none;
    }

    .phone-field {
      display: grid;
      gap: 7px;
      text-align: right;
    }

    .phone-field label {
      padding-inline: 4px;
      color: rgba(225, 231, 255, .72);
      font-family: var(--font-fa);
      font-size: 12px;
      font-weight: 700;
      transition: color .22s ease, transform .22s ease;
    }

    .phone-field:focus-within label {
      color: rgba(191, 203, 255, .98);
      transform: translateX(-2px);
    }

    .phone-input {
      width: 100%;
      min-width: 0;
      height: 54px;
      border-radius: 16px;
      border: 1px solid rgba(153, 170, 255, .24);
      background:
        linear-gradient(180deg, rgba(12, 20, 51, .92), rgba(4, 10, 31, .92));
      color: #fff;
      outline: none;
      padding: 0 16px;
      font: 700 15px var(--font-fa);
      caret-color: #9e8cff;
      appearance: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.06),
        0 8px 24px rgba(0, 0, 0, .12);
      transition:
        border-color .22s ease,
        background .22s ease,
        box-shadow .22s ease,
        transform .22s ease;
    }

    .phone-input::placeholder {
      color: rgba(196, 205, 239, .42);
      font-weight: 500;
    }

    .phone-input[data-numeric="true"] {
      direction: ltr;
      text-align: left;
      font-family: var(--font-en);
      letter-spacing: .4px;
    }

    .phone-input:focus {
      border-color: rgba(78, 141, 255, .86);
      background:
        linear-gradient(180deg, rgba(16, 27, 66, .98), rgba(6, 13, 38, .98));
      box-shadow:
        0 0 0 4px rgba(75, 105, 255, .13),
        0 14px 34px rgba(20, 42, 116, .22),
        inset 0 1px 0 rgba(255,255,255,.08);
      transform: translateY(-1px);
    }

    .phone-input:-webkit-autofill,
    .phone-input:-webkit-autofill:hover,
    .phone-input:-webkit-autofill:focus,
    .phone-input:-webkit-autofill:active {
      -webkit-text-fill-color: #fff !important;
      caret-color: #9e8cff;
      border-color: rgba(112, 134, 255, .48);
      -webkit-box-shadow:
        0 0 0 1000px #09112e inset,
        0 0 0 4px rgba(75, 105, 255, .10) !important;
      transition: background-color 9999s ease-out 0s;
    }

    .phone-submit {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 16px;
      padding: 0 18px;
      cursor: pointer;
      color: #fff;
      font-family: var(--font-fa);
      font-weight: 800;
      background: linear-gradient(to right, #a733f5 0%, #2059e6 100%);
      box-shadow: 0 12px 30px rgba(56, 99, 253, .36);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }

    .phone-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
      box-shadow: 0 16px 34px rgba(56, 99, 253, .44);
    }

    .phone-submit:active:not(:disabled) {
      transform: translateY(0) scale(.985);
    }

    .phone-submit:disabled {
      opacity: .62;
      cursor: wait;
    }

    .phone-error {
      min-height: 24px;
      margin-top: 12px;
      color: #ff9db5;
      font-family: var(--font-fa);
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    .phone-helper {
      min-height: 24px;
      margin-top: 12px;
      color: rgba(255,255,255,.72);
      font-family: var(--font-fa);
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }

    .phone-link {
      margin-top: 8px;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.72);
      font-family: var(--font-fa);
      font-size: 12px;
      cursor: pointer;
      width: 100%;
    }

    .phone-link:disabled {
      cursor: wait;
      opacity: .58;
    }

    /* ========================================================= */
    /* تنظیمات دسکتاپ                                            */
    /* ========================================================= */
    @media (min-width: 1024px) {
      .brand {
        margin-top: 6vh;
      }

      .logo-img {
        width: 160px;
      }

      .wordmark-zito {
        font-size: 46px;
      }

      .sub-en {
        font-size: 17px;
      }

      .avatar-wrap {
        bottom: 28vh;
      }

      .chat-bubble {
        left: auto;
        right: calc(50% + 56px);
        bottom: calc(31vh + 50px);
        max-width: 260px;
        min-width: 220px;
      }

      .chat-text {
        font-size: 14px;
        min-height: 80px;
      }

      .cta-wrap {
        bottom: 5vh;
      }

      .cta {
        padding: 18px 60px;
        font-size: 18px;
      }
    }

    /* ========================================================= */
    /* تنظیمات موبایل                                            */
    /* ========================================================= */
    @media (max-width: 640px) {
      .brand {
        margin-top: 10vh;
      }

      .logo-img {
        width: 180px;
        margin-bottom: 15px;
      }

      .wordmark-zito {
        font-size: 43px;
        letter-spacing: 4px;
      }

      .sub-en {
        font-size: 14px;
        font-weight: bold;
        max-width: 160px;
        margin-top: 0;
      }

      .avatar-wrap {
        bottom: 25vh;
      }

      .chat-bubble {
        left: auto;
        right: calc(50% + 40px);
        bottom: 32vh;
        max-width: 120px;
        min-width: 120px;
        padding: 10px 14px;
      }

      .chat-bubble::after {
        bottom: 14px;
        right: -14px;
        left: auto;
      }

      .chat-text {
        font-size: 10px;
        min-height: 40px;
      }

      .cta-wrap {
        bottom: 10vh;
      }

      .cta {
        width: 90%;
        padding: 10px 36px;
        font-size: 15px;
      }

      .meteor {

        el.textContent = '';
        const typedCopy = document.createElement('span');
        typedCopy.className = 'typed-copy';
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        el.appendChild(typedCopy);
        el.appendChild(cursor);
        const interval = setInterval(() => {
          if (i < text.length) {
            typedCopy.textContent = text.slice(0, i + 1);
            i++;
          } else {
            clearInterval(interval);
            cursor.remove();
            resolve();
          }
        }, speed);
      });
    }

    window.addEventListener('load', () => {
      setTimeout(async () => {
        bubble.classList.add('show');
        await new Promise(r => setTimeout(r, 400));
        await typeWriter(fullText, textEl, 35);
        setTimeout(() => {
          ctaWrap.classList.add('show');
        }, 600);
      }, 800);
    });

    function showIntro() {
      document.body.classList.add('is-intro');
      introView.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => {
        introView.classList.add('show');
        landingMascot?.suspend();
        introMascot?.activate();
      });
      setTimeout(() => introStart.focus(), 240);
    }

    function showLoginModal() {
      phoneModal.classList.add('show');
      phoneModal.setAttribute('aria-hidden', 'false');
      const focusTarget = phoneForm.dataset.step === 'otp' ? otpInput : fullNameInput;
      setTimeout(() => focusTarget.focus(), 120);
    }

    document.querySelector('.cta').addEventListener('click', async (event) => {
      event.preventDefault();
      const soundStarted = await startAmbientSound();
      if (soundStarted) await new Promise(resolve => setTimeout(resolve, 180));
      showIntro();
    });

    introStart.addEventListener('click', async () => {
      await startAmbientSound();
      try {
        const sessionResponse = await fetch('/api/me');
        if (sessionResponse.ok) {
          introMascot?.deactivate();
          stopAmbientSound();
          window.location.href = '/app/';
          return;
        }
      } catch (_) {
        // The login modal remains available when session lookup is unavailable.
      }
      showLoginModal();
    });

    phoneModal.addEventListener('click', (event) => {
      if (event.target === phoneModal) {
        phoneModal.classList.remove('show');
        phoneModal.setAttribute('aria-hidden', 'true');
      }
    });

    function getErrorMessage(data, fallback) {
      if (!data) return fallback;
      if (typeof data === 'string') return data;
      if (typeof data.detail === 'string') return data.detail;
      if (data.detail && typeof data.detail.message === 'string') return data.detail.message;
      return fallback;
    }

    async function readApiResponse(response) {
      const text = await response.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch (_) {
        return { detail: text };
      }
    }

    function normalizeDigits(value) {
      return String(value)
        .replace(/[۰-۹]/g, digit => '0123456789'['۰۱۲۳۴۵۶۷۸۹'.indexOf(digit)])
        .replace(/[٠-٩]/g, digit => '0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(digit)]);
    }

    async function requestOtpCode(phone) {
      const response = await fetch('/api/auth/otp/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });
      const data = await readApiResponse(response);
      if (!response.ok) throw new Error(getErrorMessage(data, 'ارسال کد ناموفق بود. شماره را دوباره بررسی کن.'));
      return data;
    }

    function showOtpStep(phone, data) {
      pendingPhone = phone;
      phoneForm.dataset.step = 'otp';
      phoneSubmit.hidden = true;
      otpEntry.hidden = false;
      fullNameInput.readOnly = true;
      phoneInput.readOnly = true;
      fullNameInput.tabIndex = -1;
      phoneInput.tabIndex = -1;
      changePhone.classList.remove('is-hidden');
      resendOtp.classList.remove('is-hidden');
      resendOtp.disabled = false;
      phoneCopy.textContent = `کد تایید برای ${phone} ارسال شد.`;
      const validityMinutes = Math.max(1, Math.ceil(Number(data.expires_in_seconds || 0) / 60));
      phoneHelper.textContent = data.mock_code
        ? `حالت تست: کد تایید ${data.mock_code}`
        : `کد پیامک‌شده را وارد کن. این کد تا ${validityMinutes} دقیقه معتبر است.`;
      otpInput.value = '';
      otpInput.focus();
    }

    function showDetailsStep() {
      pendingPhone = '';
      phoneForm.dataset.step = 'details';
      phoneSubmit.hidden = false;
      otpEntry.hidden = true;
      fullNameInput.readOnly = false;
      phoneInput.readOnly = false;
      fullNameInput.tabIndex = 0;
      phoneInput.tabIndex = 0;
      changePhone.classList.add('is-hidden');
      resendOtp.classList.add('is-hidden');
      phoneCopy.textContent = 'نام و شماره موبایلت را وارد کن تا کد ورود را بفرستیم.';
      phoneHelper.textContent = '';
      phoneError.textContent = '';
      phoneInput.focus();
    }

    changePhone.addEventListener('click', showDetailsStep);

    resendOtp.addEventListener('click', async () => {
      if (!pendingPhone) {
        showDetailsStep();
        return;
      }
      phoneError.textContent = '';
      resendOtp.disabled = true;
      try {
        const data = await requestOtpCode(pendingPhone);
        showOtpStep(pendingPhone, data);
      } catch (error) {
        phoneError.textContent = error.message;
      } finally {
        resendOtp.disabled = false;
      }
    });

    phoneForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      phoneError.textContent = '';
      if (phoneForm.dataset.step === 'otp') {
        otpSubmit.disabled = true;
        try {
          if (!pendingPhone) {
            showDetailsStep();
            throw new Error('اول نام و شماره موبایل را وارد کن.');
          }
          const response = await fetch('/api/auth/otp/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              phone: pendingPhone,
              code: normalizeDigits(otpInput.value).trim(),
              display_name: pendingFullName || null
            })
          });
          const data = await readApiResponse(response);
          if (!response.ok) throw new Error(getErrorMessage(data, 'کد تایید درست نیست یا منقضی شده.'));
          localStorage.setItem('zito_display_name', data.display_name || pendingFullName);
          stopAmbientSound();
          window.location.href = data.redirect_url;
        } catch (error) {
          phoneError.textContent = error.message;
        } finally {
          otpSubmit.disabled = false;
        }
        return;
      }

      phoneHelper.textContent = '';
      phoneSubmit.disabled = true;
      try {
        const fullName = fullNameInput.value.trim();
        if (!fullName) throw new Error('یک نام وارد کن.');
        const phone = normalizeDigits(phoneInput.value).trim();
        phoneInput.value = phone;
        pendingPhone = phone;
        pendingFullName = fullName;
        const data = await requestOtpCode(phone);
        showOtpStep(phone, data);
      } catch (error) {
        phoneError.textContent = error.message;
      } finally {
        phoneSubmit.disabled = false;
      }
    });
  </script>

</body>

</html>
