<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zito Admin</title>
  <link href="https://cdn.jsdelivr.net/gh/hemedani/yekan@v3.0.0/font-face.css" rel="stylesheet" type="text/css">
  <style>
    @font-face { font-family: "YekanZito"; src: local("Yekan Bakh"), local("IRANYekan"), local("B Yekan"), local("Yekan"); font-display: swap; }
    * { box-sizing: border-box; }
    :root { color-scheme: light; --font-yekan: "YekanZito", "Yekan", "Yekan Bakh", "IRANYekan", "B Yekan", Tahoma, Arial, sans-serif; --bg: #fffaf6; --card: rgba(255, 253, 250, .84); --card2: rgba(255, 250, 247, .97); --line: rgba(138, 116, 172, .18); --text: #353354; --muted: #766e85; --purple: #8b67cf; --blue: #4f99d0; --cyan: #4baeb5; --danger: #cf5273; --ok: #289977; }
    html, body, button, input, textarea, select { font-family: var(--font-yekan); }
    body * { font-family: inherit; }
    body { margin: 0; min-height: 100vh; font-family: var(--font-yekan); color: var(--text); background: radial-gradient(circle at 50% -10%, rgba(205,145,214,.16), transparent 35%), radial-gradient(circle at 10% 25%, rgba(105,183,189,.11), transparent 28%), linear-gradient(180deg, #fffdfb, #fff8f4 62%, #f5f0f8); }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(circle, rgba(120,96,170,.44) 0 1px, transparent 1.6px); background-size: 96px 96px; opacity: .28; }
    main { position: relative; z-index: 1; width: min(1180px, 100%); margin: 0 auto; padding: 22px 16px 34px; }
    .top { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark { width: 48px; height: 48px; border-radius: 17px; display: grid; place-items: center; font-weight: 900; font-size: 25px; background: linear-gradient(135deg, var(--purple), var(--blue) 70%, var(--cyan)); box-shadow: 0 0 32px rgba(112, 92, 255, .48); }
    .mark img { width: 42px; height: 36px; display: block; object-fit: contain; }
    h1 { margin: 0; font-size: 24px; }
    .muted { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .badge { width: fit-content; border: 1px solid var(--line); background: rgba(255,253,250,.78); border-radius: 999px; padding: 10px 13px; color: #746b83; font-size: 12px; box-shadow: inset 0 1px 0 rgba(255,255,255,.90); backdrop-filter: blur(14px); }
    .top-actions { display: flex; align-items: center; justify-content: end; gap: 10px; flex-wrap: wrap; }
    .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 22px; background: rgba(255,253,250,.80); box-shadow: 0 22px 70px rgba(125,91,126,.12), inset 0 1px 0 rgba(255,255,255,.94); }
    input { width: 100%; height: 48px; border: 1px solid rgba(151, 124, 169, .18); border-radius: 16px; background: rgba(255,252,249,.96); color: var(--text); padding: 0 14px; font: inherit; outline: none; transition: .18s ease; }
    input::placeholder { color: #958b9f; }
    input:focus { border-color: rgba(91, 148, 197, .58); box-shadow: 0 0 0 4px rgba(91, 148, 197, .10); }
    input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active { -webkit-text-fill-color: #353354 !important; -webkit-box-shadow: 0 0 0 1000px #fff8f2 inset !important; transition: background-color 9999s ease-out 0s; }
    button { border: 0; border-radius: 16px; min-height: 48px; padding: 0 15px; color: white; font: inherit; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, var(--purple), var(--blue)); box-shadow: 0 13px 30px rgba(91, 83, 255, .30); transition: transform .16s ease, opacity .16s ease; }
    button:hover { transform: translateY(-1px); }
    button.danger { background: linear-gradient(135deg, #ff4f7b, #b4235a); box-shadow: 0 13px 30px rgba(255, 79, 123, .20); }
    button.warning { background: linear-gradient(135deg, #d07a37, #a7562a); box-shadow: 0 13px 30px rgba(194, 111, 52, .20); }
    button.ghost { color: #746b83; background: rgba(255,253,250,.78); border: 1px solid var(--line); box-shadow: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
    .card { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 24px; padding: 16px; background: linear-gradient(180deg, rgba(255,253,250,.95), rgba(255,247,244,.90)); box-shadow: 0 24px 70px rgba(125,91,126,.13), inset 0 1px 0 rgba(255,255,255,.95); animation: pop .24s ease both; }
    .card::before { content: ""; position: absolute; inset: -80px auto auto -80px; width: 180px; height: 180px; border-radius: 50%; background: rgba(198, 139, 211, .13); filter: blur(10px); }
    .card-head { position: relative; display: flex; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .name { font-weight: 900; font-size: 17px; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 5px; direction: ltr; text-align: right; }
    .track { color: #52727a; border: 1px solid rgba(82, 169, 177, .20); background: rgba(82, 169, 177, .08); border-radius: 999px; padding: 8px 10px; height: fit-content; font-size: 11px; }
    .account-state { color: #934b2f; border: 1px solid rgba(188, 105, 48, .24); background: rgba(213, 131, 64, .10); border-radius: 999px; padding: 7px 9px; height: fit-content; font-size: 11px; }
    .answer { position: relative; margin-top: 9px; padding: 11px; border-radius: 17px; line-height: 1.8; background: rgba(255,248,245,.90); border: 1px solid rgba(151, 124, 169, .11); }
    .answer strong { display: block; color: #805fb7; margin-bottom: 5px; font-size: 12px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions button { min-height: 38px; border-radius: 13px; padding: 0 12px; font-size: 12px; }
    .empty { border: 1px solid var(--line); border-radius: 24px; padding: 30px; color: var(--muted); text-align: center; background: rgba(255,253,250,.82); box-shadow: 0 22px 70px rgba(125,91,126,.12); }
    @keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @media (max-width: 720px) { main { padding: 14px 10px 24px; } .top, .toolbar { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } .badge { justify-self: start; } }
  </style>
</head>
<body>
  <main>
    <header class="top">
      <div class="brand">
        <div class="mark"><img src="/landing-static/zito-logo.svg" alt="لوگوی زیتو"></div>
        <div><h1>پنل مدیریت زیتو</h1><div class="muted">کنترل کاربران، پاسخ‌های تایید شده و مسیر آموزشی</div></div>
      </div>
      <div id="count" class="badge">در حال بارگذاری</div>
      <button class="ghost" onclick="logoutAdmin()">خروج</button>
    </header>

    <div class="toolbar">
      <input id="search" placeholder="جستجو بر اساس نام، شماره یا اطلاعات پروفایل..." />
      <button onclick="loadUsers()">به‌روزرسانی</button>
    </div>

    <section id="content" class="empty">در حال بارگذاری...</section>
  </main>

  <script>
    const content = document.querySelector("#content");
    const count = document.querySelector("#count");
    const search = document.querySelector("#search");
    let users = [];

    function escapeHtml(value) { return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;"); }
    function filteredUsers() { const term = search.value.trim().toLowerCase(); if (!term) return users; return users.filter((user) => [user.display_name, user.phone, user.work_or_study_field, user.education_level, user.learning_goal_interests, user.ai_familiarity_level, user.daily_learning_time_text, user.preferred_career_path, user.referral_source].filter(Boolean).join(" ").toLowerCase().includes(term)); }
    function profileRow(label, value) { return `<div class="answer"><strong>${escapeHtml(label)}</strong><div>${escapeHtml(value || "ثبت نشده")}</div></div>`; }

    function render() {
      const rows = filteredUsers();
      count.textContent = `${users.length} کاربر ثبت شده`;
      if (!rows.length) { content.className = "empty"; content.textContent = users.length ? "نتیجه‌ای برای این جستجو پیدا نشد." : "هنوز کاربری ثبت نشده است."; return; }
      content.className = "grid";
      content.innerHTML = rows.map((user) => `
        <article class="card">
          <div class="card-head">
            <div><div class="name">${escapeHtml(user.display_name || "کاربر بدون نام")}</div><div class="meta">ID ${user.id} · ${escapeHtml(user.phone || "شماره ثبت نشده")}</div></div>
            <div class="track">${escapeHtml(user.work_or_study_field || "مسیر نامشخص")}</div>
            ${user.blocked_at ? '<div class="account-state">مسدود شده</div>' : ''}
          </div>
          ${profileRow("حوزه کاری یا تحصیلی", user.work_or_study_field)}
          ${profileRow("سطح تحصیلات", user.education_level)}
          ${profileRow("هدف و علاقه‌مندی", user.learning_goal_interests)}
          ${profileRow("آشنایی با هوش مصنوعی", user.ai_familiarity_level)}
          ${profileRow("زمان روزانه", user.daily_learning_time_text || (user.daily_learning_minutes == null ? null : `${user.daily_learning_minutes} دقیقه`))}
          ${profileRow("مسیر شغلی مورد علاقه", user.preferred_career_path)}
          ${profileRow("نحوه آشنایی با زیتو", user.referral_source)}
          <div class="actions">
            <button class="ghost" onclick="deleteUser(${user.id})">حذف کاربر</button>
            ${user.blocked_at
              ? `<button onclick="unblockUser(${user.id})">رفع مسدودیت</button>`
              : `<button class="warning" onclick="blockUser(${user.id})">مسدود کردن</button>`}
          </div>
        </article>`).join("");
    }

    async function loadUsers() { const res = await fetch("/api/admin/users"); if (res.status === 401) { window.location.href = "/admin/login"; return; } if (!res.ok) throw new Error("دسترسی ادمین تایید نشد یا دریافت اطلاعات ناموفق بود."); users = await res.json(); render(); }
    async function deleteUser(id) { if (!confirm("کاربر حذف نرم شود؟ نشست او بسته می‌شود، اما با ورود بعدی از طریق شماره دوباره فعال خواهد شد.")) return; const res = await fetch(`/api/admin/users/${id}`, { method: "DELETE" }); if (!res.ok) { alert("حذف انجام نشد."); return; } await loadUsers(); }
    async function blockUser(id) { if (!confirm("این کاربر مسدود شود؟ دیگر نمی‌تواند کد ورود بگیرد یا وارد شود.")) return; const res = await fetch(`/api/admin/users/${id}/block`, { method: "POST" }); if (!res.ok) { alert("مسدودسازی انجام نشد."); return; } await loadUsers(); }
    async function unblockUser(id) { if (!confirm("مسدودیت این کاربر برداشته شود؟")) return; const res = await fetch(`/api/admin/users/${id}/unblock`, { method: "POST" }); if (!res.ok) { alert("رفع مسدودیت انجام نشد."); return; } await loadUsers(); }
    async function logoutAdmin() { await fetch("/api/admin/logout", { method: "POST" }); window.location.href = "/admin/login"; }

    search.addEventListener("input", render);
    loadUsers().catch((error) => { count.textContent = "خطا"; content.className = "empty"; content.textContent = error.message; });
  </script>
</body>
</html>
