<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>معرفی دوره | زیتو</title>
  <link rel="preload" href="/landing-static/fonts/Yekan.woff2" as="font" type="font/woff2" crossorigin>
  <script defer src="/landing-static/course-mascot.js?v=20260831-9"></script>
  <style>
    @font-face {
      font-family: "YekanZito";
      src: url("/landing-static/fonts/Yekan.woff2") format("woff2"), local("Yekan Bakh"), local("IRANYekan"), local("B Yekan"), local("Yekan");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --font-yekan: "YekanZito", "Yekan", "Yekan Bakh", "IRANYekan", "B Yekan", Tahoma, Arial, sans-serif;
      --ink: #372d45;
      --ink-soft: #62566c;
      --muted: #81738a;
      --plum: #7257b8;
      --violet: #8f70ca;
      --sky: #6aaec2;
      --peach: #efa984;
      --cream: #fffaf5;
      --line: rgba(117, 87, 157, .16);
      --surface: rgba(255, 253, 249, .78);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: var(--font-yekan);
      font-size: 16px;
      line-height: 1.6;
      background: linear-gradient(180deg, #fff9f4 0%, #fffdf9 39%, #fbf5fb 100%);
    }
    body * { font-family: inherit; }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .44;
      background-image:
        radial-gradient(circle at 8% 11%, rgba(238, 169, 132, .34) 0 1px, transparent 1.8px),
        radial-gradient(circle at 83% 20%, rgba(116, 87, 182, .30) 0 1px, transparent 1.8px),
        radial-gradient(circle at 24% 72%, rgba(84, 162, 174, .28) 0 1px, transparent 1.8px);
      background-size: 109px 109px, 137px 137px, 171px 171px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }
    button, a { -webkit-tap-highlight-color: transparent; }
    button, input, textarea, select { font: inherit; }

    .page { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 20px 0 76px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 56px; gap: 18px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
    .brand img { width: 37px; height: 37px; object-fit: contain; }
    .brand strong { font-size: 16px; letter-spacing: .08em; }
    .back-link { padding: 8px 0; color: #68577c; font-size: 13px; font-weight: 800; text-decoration: none; }
    .back-link:hover { color: var(--plum); }

    .loading, .error { min-height: 60vh; display: grid; place-items: center; text-align: center; color: var(--muted); }
    .error > div { max-width: 470px; padding: 30px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
    .error strong { display: block; color: var(--ink); font-size: 18px; }
    .error p { margin: 10px 0 0; line-height: 2; }
    .error a { display: inline-flex; margin-top: 18px; color: var(--plum); font-weight: 900; }

    .course-hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.16fr) minmax(310px, .84fr);
      gap: clamp(30px, 5vw, 70px);
      align-items: center;
      min-height: 500px;
      margin-top: 15px;
      padding: clamp(30px, 5.5vw, 76px);
      overflow: hidden;
      border: 1px solid rgba(121, 90, 168, .17);
      border-radius: 30px;
      background: linear-gradient(118deg, rgba(255, 253, 250, .98), rgba(255, 247, 242, .94) 48%, rgba(246, 241, 253, .88));
      box-shadow: 0 24px 60px rgba(106, 76, 132, .10);
    }
    .course-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0 46%, rgba(235, 168, 135, .13) 46.1% 46.4%, transparent 46.5% 100%),
        linear-gradient(29deg, transparent 0 68%, rgba(104, 166, 183, .11) 68.1% 68.35%, transparent 68.45% 100%);
    }
    .hero-copy, .hero-visual { position: relative; z-index: 1; min-width: 0; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 15px; color: #7a5e9b; font-size: 12px; font-weight: 900; }
    .eyebrow::before { width: 22px; height: 2px; border-radius: 999px; background: linear-gradient(90deg, var(--peach), var(--violet)); content: ""; }
    h1 { max-width: 730px; margin: 0; color: #3e314f; font-size: clamp(34px, 4.7vw, 59px); line-height: 1.24; letter-spacing: 0; }
    .hero-summary { max-width: 670px; margin: 20px 0 0; color: var(--ink-soft); font-size: clamp(15px, 1.6vw, 18px); line-height: 2.15; }
    .course-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 680px; margin-top: 29px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .course-fact { min-width: 0; padding: 14px 14px 13px; border-right: 1px solid var(--line); }
    .course-fact:first-child { border-right: 0; }
    .course-fact span, .course-fact strong { display: block; }
    .course-fact span { color: #8b7d92; font-size: 11px; }
    .course-fact strong { margin-top: 4px; color: #50405e; font-size: 14px; line-height: 1.55; }

    .hero-visual { min-height: 330px; display: grid; place-items: center; }
    .constellation { position: absolute; width: min(100%, 340px); aspect-ratio: 1; border: 1px solid rgba(119, 89, 174, .20); border-radius: 50%; transform: rotate(-11deg); }
    .constellation::before, .constellation::after { content: ""; position: absolute; border-radius: inherit; inset: 18px; border: 1px dashed rgba(100, 166, 179, .32); }
    .constellation::after { inset: 48px; border-style: solid; border-color: rgba(239, 169, 132, .24); }
    .orbit-dot { position: absolute; width: 13px; height: 13px; border-radius: 50%; background: linear-gradient(145deg, #f0ad8d, #9574ce); box-shadow: 0 0 0 5px rgba(255, 250, 245, .7), 0 5px 15px rgba(138, 92, 169, .23); }
    .orbit-dot.one { top: 25px; right: 59px; }
    .orbit-dot.two { bottom: 52px; left: 23px; width: 10px; height: 10px; background: linear-gradient(145deg, #72bdba, #7699d0); }
    .orbit-dot.three { top: 48%; left: -4px; width: 8px; height: 8px; }
    .mascot-station { position: relative; z-index: 1; display: grid; place-items: center; width: 258px; height: 302px; }
    .mascot-station::after { content: ""; position: absolute; right: 50%; bottom: 12px; width: 145px; height: 16px; border-radius: 50%; transform: translateX(50%); background: radial-gradient(ellipse, rgba(125, 93, 193, .27), transparent 70%); filter: blur(3px); }
    .mascot-station zito-course-mascot { position: relative; z-index: 1; width: 250px; height: 300px; filter: drop-shadow(0 18px 20px rgba(93, 69, 143, .20)); }

    .section { margin-top: clamp(62px, 9vw, 108px); }
    .section-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, .55fr); gap: 30px; align-items: end; margin-bottom: 28px; }
    .section-kicker { color: #86679c; font-size: 12px; font-weight: 900; }
    h2 { margin: 6px 0 0; color: #443550; font-size: clamp(25px, 3.3vw, 37px); line-height: 1.45; }
    .section-intro { max-width: 430px; margin: 0; color: var(--muted); font-size: 14px; line-height: 2; }

    .course-story { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(240px, .8fr); gap: 34px; padding: 4px 0 32px; border-bottom: 1px solid var(--line); }
    .course-story > p { max-width: 680px; margin: 0; color: #5f536a; font-size: 16px; line-height: 2.2; }
    .course-promise { padding: 4px 18px 4px 0; border-right: 3px solid transparent; border-image: linear-gradient(var(--violet), var(--sky)) 1; }
    .course-promise span { color: #846f91; font-size: 11px; font-weight: 900; }
    .course-promise strong { display: block; margin-top: 7px; color: #524161; font-size: 15px; line-height: 1.9; }

    .outcome-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 28px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .outcome { min-width: 0; padding: 25px 26px 27px; border-right: 1px solid var(--line); }
    .outcome:first-child { border-right: 0; }
    .outcome-index { color: #a17ab1; font-size: 11px; font-weight: 900; }
    .outcome h3 { margin: 8px 0 12px; color: #53405e; font-size: 17px; }
    .outcome ul { margin: 0; padding: 0; list-style: none; }
    .outcome li { position: relative; padding-right: 19px; color: #75697b; font-size: 13px; line-height: 2; }
    .outcome li::before { content: ""; position: absolute; right: 1px; top: .85em; width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(145deg, var(--peach), var(--violet)); }

    .learning-map { position: relative; display: grid; gap: 0; }
    .learning-map::before { content: ""; position: absolute; top: 42px; right: 28px; bottom: 46px; width: 1px; background: linear-gradient(180deg, rgba(117, 87, 184, .65), rgba(103, 172, 189, .47), rgba(239, 169, 132, .45)); }
    .module-row { position: relative; z-index: 1; display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 23px; padding: 0 0 32px; }
    .module-row:last-child { padding-bottom: 0; }
    .module-marker { width: 57px; height: 57px; display: grid; place-items: center; color: #fff; border: 6px solid var(--cream); border-radius: 50%; background: linear-gradient(145deg, var(--plum), var(--sky)); box-shadow: 0 8px 22px rgba(106, 75, 157, .22); font-size: 14px; font-weight: 900; }
    .module-body { min-width: 0; padding: 2px 0 0; }
    .module-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 18px; }
    .module-heading h3 { margin: 0; color: #4c3b58; font-size: clamp(18px, 2vw, 22px); line-height: 1.5; }
    .module-heading span { flex: none; color: #806399; font-size: 11px; font-weight: 900; }
    .module-description { max-width: 760px; margin: 7px 0 0; color: #756a7b; font-size: 14px; line-height: 2; }
    .module-objectives { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .module-objectives span { padding: 6px 10px; color: #665574; border: 1px solid rgba(117, 87, 157, .13); border-radius: 999px; background: rgba(255, 251, 248, .68); font-size: 11px; line-height: 1.5; }
    .stage-track { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; max-width: 620px; margin-top: 18px; }
    .stage-track span { height: 5px; border-radius: 999px; background: linear-gradient(90deg, rgba(143, 112, 202, .88), rgba(97, 172, 185, .64)); }
    .stage-track span:nth-child(3n) { background: linear-gradient(90deg, rgba(239, 169, 132, .84), rgba(143, 112, 202, .76)); }

    .destination-section { margin-top: clamp(62px, 9vw, 108px); }
    .destination-panel {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, .46fr) minmax(0, 1fr);
      gap: clamp(18px, 3vw, 42px);
      align-items: center;
      padding: clamp(24px, 4.5vw, 48px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .74);
      border-radius: 30px;
      background:
        radial-gradient(58% 100% at 50% 48%, rgba(129, 111, 201, .12), transparent 70%),
        linear-gradient(135deg, rgba(255, 255, 255, .64), rgba(255, 247, 245, .42) 52%, rgba(227, 241, 251, .46));
      box-shadow: 0 20px 46px rgba(85, 67, 124, .10), inset 0 1px 0 rgba(255, 255, 255, .88);
    }
    .destination-panel::before {
      content: "";
      position: absolute;
      inset: auto 14% 50%;
      height: 1px;
      background: linear-gradient(90deg, rgba(235, 157, 156, .22), rgba(119, 96, 191, .42), rgba(74, 179, 182, .25));
      pointer-events: none;
    }
    .destination-card, .destination-avatar { position: relative; z-index: 1; min-width: 0; }
    .destination-card {
      min-height: 255px;
      padding: clamp(20px, 3vw, 29px);
      border: 1px solid rgba(255, 255, 255, .70);
      border-radius: 23px;
      background: rgba(255, 255, 255, .42);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .82);
    }
    .destination-card.before { background: linear-gradient(145deg, rgba(255, 245, 244, .72), rgba(252, 235, 239, .45)); }
    .destination-card.after { background: linear-gradient(145deg, rgba(246, 255, 251, .68), rgba(229, 247, 249, .48)); }
    .destination-kicker { display: block; font-size: 11px; font-weight: 900; }
    .before .destination-kicker { color: #b86c82; }
    .after .destination-kicker { color: #438d88; }
    .destination-card h3 { margin: 8px 0 17px; color: #4d3b59; font-size: clamp(18px, 2.1vw, 22px); line-height: 1.65; }
    .destination-list { display: grid; gap: 11px; margin: 0; padding: 0; list-style: none; }
    .destination-list li { position: relative; padding-right: 23px; color: #70647a; font-size: 13px; line-height: 1.9; }
    .destination-list li::before { content: ""; position: absolute; right: 0; top: .65em; width: 11px; height: 11px; border-radius: 50%; }
    .before .destination-list li::before { background: radial-gradient(circle at 35% 30%, #fff 0 17%, transparent 20%), #dd8294; box-shadow: 0 0 0 4px rgba(221, 130, 148, .10); }
    .after .destination-list li::before { background: radial-gradient(circle at 35% 30%, #fff 0 17%, transparent 20%), #55a996; box-shadow: 0 0 0 4px rgba(85, 169, 150, .10); }
    .destination-avatar { min-height: 266px; display: grid; place-items: center; align-content: center; }
    .destination-avatar::before { content: ""; position: absolute; width: 178px; aspect-ratio: 1; border: 1px dashed rgba(116, 91, 181, .36); border-radius: 50%; transform: rotate(-16deg); }
    .destination-avatar::after { content: ""; position: absolute; bottom: 31px; width: 126px; height: 16px; border-radius: 50%; background: radial-gradient(ellipse, rgba(105, 85, 178, .26), transparent 70%); filter: blur(3px); }
    .destination-avatar zito-course-mascot { position: relative; z-index: 1; width: 188px; height: 222px; filter: drop-shadow(0 16px 17px rgba(80, 64, 137, .20)); }
    .destination-direction { position: relative; z-index: 2; margin-top: -4px; padding: 6px 11px; color: #6e5d96; border: 1px solid rgba(122, 98, 179, .18); border-radius: 999px; background: rgba(255, 255, 255, .57); font-size: 10px; font-weight: 900; }

    .route-section { margin-top: clamp(66px, 9vw, 108px); }
    .zito-glass-course .course-route.learning-map {
      position: relative;
      padding: clamp(23px, 4vw, 42px) !important;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .73) !important;
      border-radius: 30px;
      outline: 1px solid rgba(126, 102, 176, .14);
      outline-offset: -1px;
      background:
        radial-gradient(65% 90% at 12% 100%, rgba(239, 169, 132, .14), transparent 70%),
        radial-gradient(57% 78% at 92% 4%, rgba(100, 180, 196, .14), transparent 68%),
        linear-gradient(135deg, rgba(255, 255, 255, .62), rgba(255, 248, 245, .36) 53%, rgba(225, 238, 255, .42)) !important;
      box-shadow: 0 19px 38px rgba(87, 69, 131, .09), inset 0 1px 0 rgba(255, 255, 255, .86) !important;
    }
    .zito-glass-course .course-route.learning-map::before { display: none; }
    .route-legend { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 14px; color: #776889; font-size: 11px; font-weight: 800; }
    .route-legend span { display: inline-flex; align-items: center; gap: 7px; }
    .route-legend span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(145deg, var(--violet), var(--sky)); box-shadow: 0 0 0 4px rgba(132, 107, 193, .10); }
    .route-track { position: relative; min-width: 0; padding: 39px 0 6px; }
    .route-road { position: absolute; z-index: 0; top: 0; right: 0; width: 100%; height: 150px; overflow: visible; pointer-events: none; }
    .route-road-shadow { fill: none; stroke: rgba(109, 87, 169, .11); stroke-width: 20; stroke-linecap: round; filter: drop-shadow(0 8px 9px rgba(91, 73, 146, .09)); }
    .route-road-surface { fill: none; stroke: rgba(255, 255, 255, .53); stroke-width: 13; stroke-linecap: round; }
    .route-road-lane { fill: none; stroke: rgba(113, 89, 180, .74); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 13; animation: route-road-flow 5.8s linear infinite; }
    .route-traveler { stroke: rgba(255, 255, 255, .92); stroke-width: 2; filter: drop-shadow(0 4px 5px rgba(83, 67, 146, .25)); }
    .route-traveler-secondary { opacity: .76; }
    .route-track::before, .route-track::after { display: none; }
    .route-stops { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(var(--route-count), minmax(0, 1fr)); gap: 14px; margin: 0; padding: 0; list-style: none; }
    .route-stop { position: relative; display: grid; justify-items: center; min-width: 0; }
    .route-stop:nth-child(even) { padding-top: 28px; }
    .route-node { width: 56px; height: 56px; display: grid; place-items: center; color: #fff; border: 6px solid rgba(255, 253, 249, .94); border-radius: 50%; background: linear-gradient(145deg, #8364c5, #58aabd); box-shadow: 0 8px 18px rgba(102, 79, 163, .22); font-size: 14px; font-weight: 900; animation: route-node-bob 4.6s ease-in-out infinite; }
    .route-stop:nth-child(3n + 2) .route-node { animation-delay: -1.35s; }
    .route-stop:nth-child(3n) .route-node { animation-delay: -2.7s; }
    .route-stop:nth-child(3n) .route-node { background: linear-gradient(145deg, #b27cca, #7aa9cd); }
    .route-card { width: 100%; min-height: 165px; margin-top: 15px; padding: 17px 16px 15px; border: 1px solid rgba(255, 255, 255, .76); border-radius: 19px; background: rgba(255, 255, 255, .44); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .78); }
    .route-card span { display: block; color: #836d99; font-size: 10px; font-weight: 900; }
    .route-card h3 { margin: 7px 0 0; color: #503e5b; font-size: 15px; line-height: 1.75; }
    .route-card p { margin: 6px 0 0; color: #786b81; font-size: 11px; line-height: 1.9; }
    .route-card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 11px; }
    .route-card-tags span { padding: 4px 7px; color: #71607f; border: 1px solid rgba(124, 101, 179, .13); border-radius: 999px; background: rgba(255, 255, 255, .47); font-size: 9px; line-height: 1.5; }
    .route-stage-dots { display: grid; grid-template-columns: repeat(var(--stage-count), minmax(0, 1fr)); gap: 3px; margin-top: 12px; }
    .route-stage-dots i { height: 4px; border-radius: 999px; background: linear-gradient(90deg, rgba(135, 105, 197, .76), rgba(90, 169, 184, .63)); }
    .route-stage-dots i:nth-child(3n) { background: linear-gradient(90deg, rgba(236, 166, 135, .76), rgba(139, 110, 198, .70)); }
    .route-finish { position: relative; z-index: 1; display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 18px; color: #715e8a; font-size: 11px; font-weight: 900; }
    .route-finish::before { content: ""; width: 16px; height: 20px; border-radius: 3px 3px 3px 0; background: linear-gradient(145deg, var(--violet), var(--sky)); clip-path: polygon(0 0, 100% 20%, 0 42%, 100% 63%, 0 84%); }
    @keyframes route-road-flow { to { stroke-dashoffset: -90; } }
    @keyframes route-node-bob {
      0%, 100% { transform: translateY(0); box-shadow: 0 8px 18px rgba(102, 79, 163, .22); }
      50% { transform: translateY(-4px); box-shadow: 0 13px 22px rgba(102, 79, 163, .28); }
    }

    .impact-section { margin-top: clamp(66px, 9vw, 108px); }
    .impact-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; }
    .impact-card { position: relative; min-height: 208px; padding: 24px 23px; overflow: hidden; border: 1px solid rgba(255, 255, 255, .76); border-radius: 23px; background: linear-gradient(145deg, rgba(255, 255, 255, .57), rgba(250, 244, 250, .34)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .84), 0 11px 22px rgba(101, 81, 144, .06); }
    .impact-card:nth-child(2) { background: linear-gradient(145deg, rgba(253, 246, 254, .65), rgba(235, 235, 255, .38)); }
    .impact-card:nth-child(3) { background: linear-gradient(145deg, rgba(244, 253, 253, .65), rgba(229, 243, 251, .39)); }
    .impact-number { display: inline-grid; width: 34px; height: 34px; place-items: center; color: #725da0; border: 1px solid rgba(127, 98, 183, .14); border-radius: 12px; background: rgba(255, 255, 255, .56); font-size: 11px; font-weight: 900; }
    .impact-card h3 { margin: 19px 0 8px; color: #51405d; font-size: 18px; line-height: 1.65; }
    .impact-card p { max-width: 240px; margin: 0; color: #756a7d; font-size: 13px; line-height: 2; }
    .impact-mascot { position: absolute; left: 10px; bottom: -17px; width: 112px; height: 125px; object-fit: contain; object-position: bottom; opacity: .92; filter: drop-shadow(0 11px 12px rgba(79, 68, 142, .16)); }

<body class="zito-glass zito-glass-course">

  <script>
    const screen = document.querySelector("#screen");
    const slug = decodeURIComponent(location.pathname.split("/").filter(Boolean).at(-1) || "");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
      });
      const body = await response.text();
      let data = {};
      try { data = body ? JSON.parse(body) : {}; } catch (_) { data = { detail: body }; }
      if (!response.ok) {
        const error = new Error(typeof data.detail === "string" ? data.detail : "درخواست ناموفق بود.");
        error.status = response.status;
        throw error;
      }
      return data;
    }

    function list(items) {
      const values = Array.isArray(items) ? items.filter(Boolean) : [];
      return values.map((item) => `<li>${escapeHtml(item)}</li>`).join("");
    }

    function objectives(items, limit = 3) {
      const values = Array.isArray(items) ? items.filter(Boolean).slice(0, limit) : [];
      return values.map((item) => `<span>${escapeHtml(item)}</span>`).join("");
    }

    function stageDots(count) {
      const total = Math.max(1, Math.min(12, Number(count) || 1));
      return Array.from({ length: total }, () => "<i></i>").join("");
    }

    function routeRoad(count) {
      const total = Math.max(1, Math.min(12, Number(count) || 1));
      const points = Array.from({ length: total }, (_, index) => ({
        x: total === 1 ? 500 : 1000 - ((index + .5) * (1000 / total)),
        y: index % 2 === 0 ? 66 : 94,
      }));

      if (total === 1) {
        return `<svg class="route-road" viewBox="0 0 1000 150" preserveAspectRatio="none" aria-hidden="true"><circle cx="500" cy="66" r="18" fill="rgba(130, 101, 196, .10)"></circle></svg>`;
      }

      const roadPath = points.slice(1).reduce((path, point, index) => {
        const previous = points[index];
        const bend = (previous.x + point.x) / 2;
        return `${path} C ${bend} ${previous.y}, ${bend} ${point.y}, ${point.x} ${point.y}`;
      }, `M ${points[0].x} ${points[0].y}`);

      return `<svg class="route-road" viewBox="0 0 1000 150" preserveAspectRatio="none" aria-hidden="true">

        <path id="course-route-motion-path" class="route-road-lane" d="${roadPath}"></path>
        <circle class="route-traveler" cx="0" cy="0" r="7" fill="url(#course-route-orb)">

        </circle>

          <animateMotion begin="-3.8s" dur="7.6s" repeatCount="indefinite" rotate="auto"><mpath href="#course-route-motion-path"></mpath></animateMotion>
        </circle>

        "آموخته‌ها را به موقعیت‌های واقعی خودت وصل می‌کنی.",
      ];

      const firstModuleTitle = modules[0]?.title || "اولین ایستگاه مسیر";
      const routeFinishLabel = course.requires_final_exam ? "آزمون نهایی و گواهی" : "پایان مسیر";
      const certificateCompletionLabel = course.requires_final_exam ? "پس از تکمیل مسیر و ارزیابی نهایی" : "پس از تکمیل تمام ایستگاه‌های مسیر";
      const certificateProgressPoint = course.requires_final_exam

        : "پس از تکمیل همهٔ ایستگاه‌ها، خروجی نهایی مسیر برایت فعال می‌شود.";
      screen.className = "";
      screen.innerHTML = `

          </div>
          <div class="hero-visual" aria-hidden="true">

            <i class="orbit-dot one"></i><i class="orbit-dot two"></i><i class="orbit-dot three"></i>

            <p class="section-intro">${escapeHtml(course.description || "در این دوره، هر قدم کوچک به یک نتیجه قابل استفاده در زندگی و کار تو وصل می‌شود.")}</p>

                    <span class="route-node">${escapeHtml(module.module_number)}</span>
                    <article class="route-card">
                      <span>سرفصل ${escapeHtml(module.module_number)}</span>
                      <h3>${escapeHtml(module.title)}</h3>
                      <p>${moduleStageCount} ایستگاه یادگیری و تمرین</p>
                      <div class="route-card-tags">${objectives(module.learning_objectives, 2)}</div>
                      <div class="route-stage-dots" style="--stage-count: ${Math.min(12, moduleStageCount)}" aria-label="${moduleStageCount} مرحله برای ${escapeHtml(module.title)}">${stageDots(moduleStageCount)}</div>
                    </article>
                  </li>`;
                }).join("")}
              </ol>
            </div>
            <div class="route-finish">${escapeHtml(routeFinishLabel)}</div>
          </div>
        </section>

        <section class="impact-section" aria-labelledby="impact-title">
          <div class="section-head">
            <div><span class="section-kicker">چیزی که همراهت می‌ماند</span><h2 id="impact-title">این دوره چه چیزی را برایت متفاوت می‌کند؟</h2></div>
            <p class="section-intro">هدف فقط گذراندن محتوا نیست؛ می‌خواهیم چیزی بسازی که در روزهای بعد هم به کارت بیاید.</p>
          </div>
          <div class="impact-grid">
            <article class="impact-card">
              <span class="impact-number">۰۱</span>
              <h3>تمرین‌های کوتاه و هدفمند</h3>
              <p>هر ایستگاه یک کار کوچک دارد تا یادگیری از صفحه بیرون بیاید و قابل انجام بماند.</p>
            </article>
            <article class="impact-card">
              <span class="impact-number">۰۲</span>
              <h3>مسیر قابل پیگیری</h3>
              <p>همیشه می‌دانی در کجای مسیر هستی، چه چیزی تمام شده و قدم بعدی چیست.</p>
            </article>
            <article class="impact-card has-mascot">
              <span class="impact-number">۰۳</span>
              <h3>همراهی زیتو در راه</h3>
              <p>هرجا گیر کردی، زیتو کنار همان سرفصل برای فکرکردن و جلو رفتن همراهت است.</p>
              <img class="impact-mascot" src="/landing-static/course-mascot-lottie/assets/zito-state-a.png" alt="" loading="lazy">
            </article>
          </div>
        </section>

        <section class="certificate-showcase" aria-labelledby="certificate-title">
          <div class="certificate-preview" aria-label="پیش‌نمایش گواهی پایان دوره زیتو">
            <img src="/landing-static/zito-logo.svg" alt="">
            <span>گواهی پایان دوره زیتو</span>
            <strong>${escapeHtml(course.title)}</strong>
            <small>${escapeHtml(certificateCompletionLabel)}</small>
          </div>
          <div class="certificate-copy">
            <span>پایان مسیر، یک خروجی قابل اتکا</span>
            <h2 id="certificate-title">گواهی دوره فقط یک تصویر نیست؛ نشانهٔ مسیری است که واقعاً طی کرده‌ای.</h2>
            <p>${escapeHtml(finalExamLabel)}</p>
            <ul class="certificate-points">
              <li>مسیر و پیشرفتت مرحله‌به‌مرحله ثبت می‌شود.</li>
              <li>${escapeHtml(certificateProgressPoint)}</li>
              <li>پس از قبولی، گواهی قابل بررسی زیتو برایت صادر می‌شود.</li>
            </ul>
          </div>
        </section>

        <section class="course-finish" aria-labelledby="finish-title">
          <div class="course-finish-visual" aria-hidden="true">
            <div class="finish-portal"></div>
            <img class="finish-mascot" src="/landing-static/course-mascot-lottie/assets/zito-state-b.png" alt="" loading="lazy">
          </div>
          <div class="course-finish-copy">
            <span>مسیر آماده است</span>
            <h2 id="finish-title">شروع از یک قدم کوچک، ادامه تا یک تغییر واقعی.</h2>
            <p>پیشرفتت ذخیره می‌شود، هر زمان خواستی برمی‌گردی و در هر ایستگاه زیتو را کنار خودت داری.</p>
            <div class="finish-next"><span>اولین ایستگاه</span><strong>${escapeHtml(firstModuleTitle)}</strong></div>
            <button id="startCourse" class="course-start" type="button"><span>شروع مسیر</span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h13M13 6l6 6-6 6" /></svg></button>
          </div>
        </section>`;

      document.querySelector("#startCourse").addEventListener("click", async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = "در حال شروع...";
        try {
          await api(`/api/courses/${course.id}/enroll`, { method: "POST" });
          location.assign("/app/");
        } catch (error) {
          button.disabled = false;
          button.textContent = "شروع دوره";
          alert(error.message);
        }
      });
    }

    async function start() {
      try {
        await api("/api/me");
        render(await api(`/api/courses/slug/${encodeURIComponent(slug)}`));
      } catch (error) {
        if (error.status === 401 || error.status === 403) {
          location.replace("/");
          return;
        }
        screen.className = "error";
        screen.innerHTML = `<div><strong>معرفی این دوره فعلاً در دسترس نیست.</strong><p>${escapeHtml(error.message)}</p><a href="/app/">بازگشت به زیتو</a></div>`;
      }
    }

    start();
  </script>
</body>
</html>
