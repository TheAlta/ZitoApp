<html lang="fa" dir="rtl">

  <link rel="preload" href="/landing-static/fonts/Yekan.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/landing-static/zito-glass.css?v=20260920-scrollbar-1">
  <style>
    @font-face { font-family:"YekanZito"; src:url("/landing-static/fonts/Yekan.woff2") format("woff2"),local("Yekan Bakh"),local("IRANYekan"),local("Yekan"); font-style:normal; font-weight:400; font-display:swap; }
    :root { color-scheme: light; --font:"YekanZito", "Yekan", "Yekan Bakh", Tahoma, sans-serif; --ink:#312b4a; --muted:#776f8e; --line:rgba(102,83,151,.18); --glass:rgba(255,255,255,.55); --violet:#7554d8; --blue:#45aacf; --danger:#bd506b; --ok:#167d62; }
    * { box-sizing:border-box; } html,body,button,input,textarea,select { font-family:var(--font); } body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 8% 18%,rgba(253,177,212,.57),transparent 27%),radial-gradient(circle at 93% 72%,rgba(117,220,233,.48),transparent 28%),linear-gradient(135deg,#fff8fb 0%,#f8f1ff 48%,#effbff 100%); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.24; background-image:radial-gradient(circle,rgba(94,79,169,.52) 0 1px,transparent 1.7px); background-size:74px 74px; }
    button,input,textarea,select { font-size:14px; } button { min-height:42px; border:0; border-radius:13px; padding:0 15px; color:white; cursor:pointer; font-weight:800; background:linear-gradient(135deg,var(--violet),var(--blue)); box-shadow:0 10px 22px rgba(89,70,180,.22); transition:transform .16s ease,filter .16s ease; } button:hover:not(:disabled) { transform:translateY(-1px); filter:saturate(1.1); } button:disabled { opacity:.58; cursor:wait; } button.ghost { color:#645a78; border:1px solid var(--line); background:rgba(255,255,255,.56); box-shadow:none; } button.publish { background:linear-gradient(135deg,#276f9b,#23a998); }
    .shell { position:relative; width:min(1440px,100%); min-height:100vh; margin:auto; padding:18px; }.top { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:12px 16px; margin-bottom:14px; border:1px solid rgba(255,255,255,.8); border-radius:22px; background:rgba(255,255,255,.48); box-shadow:0 17px 45px rgba(89,69,128,.12), inset 0 1px 0 rgba(255,255,255,.95); backdrop-filter:blur(24px) saturate(140%); }.brand { display:flex; align-items:center; gap:11px; }.brand img { width:43px; height:43px; padding:7px; border:1px solid rgba(255,255,255,.8); border-radius:15px; background:rgba(255,255,255,.5); }h1 { margin:0; font-size:19px; }.sub { margin-top:3px; font-size:12px; color:var(--muted); }.top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }.status { font-size:12px; color:var(--muted); }
    .workspace { display:grid; grid-template-columns:290px minmax(0,1fr); gap:14px; align-items:start; }.panel { border:1px solid rgba(255,255,255,.78); border-radius:22px; background:var(--glass); box-shadow:0 17px 42px rgba(89,69,128,.11),inset 0 1px 0 rgba(255,255,255,.9); backdrop-filter:blur(24px) saturate(135%); }.catalog { position:sticky; top:16px; padding:12px; max-height:calc(100vh - 36px); overflow:auto; }.catalog-head { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 4px 12px; }.catalog-head strong { font-size:15px; }.catalog-head button { min-height:34px; padding:0 10px; font-size:12px; }.catalog-list { display:grid; gap:13px; }.catalog-group { display:grid; gap:5px; }.catalog-group-head { display:flex; align-items:center; justify-content:space-between; padding:0 4px; color:#5e5574; font-size:12px; font-weight:900; }.catalog-group-count { display:grid; place-items:center; min-width:24px; height:24px; padding:0 7px; border:1px solid rgba(255,255,255,.78); border-radius:999px; color:#675d7c; background:rgba(255,255,255,.44); font-size:10px; }.catalog-group-list { display:grid; gap:7px; }.catalog-empty { padding:10px 11px; border:1px dashed rgba(113,91,153,.18); border-radius:13px; color:var(--muted); background:rgba(255,255,255,.2); font-size:11px; text-align:center; }.course-row { width:100%; min-height:0; margin:0; padding:11px; display:grid; grid-template-columns:38px minmax(0,1fr); gap:9px; text-align:right; color:var(--ink); background:rgba(255,255,255,.46); border:1px solid transparent; box-shadow:none; }.course-row:hover,.course-row.active { transform:none; border-color:rgba(92,126,211,.4); background:rgba(255,255,255,.73); }.course-orb { display:grid; place-items:center; width:38px; height:38px; border-radius:50%; color:white; background:linear-gradient(135deg,#a46cda,#42b6ce); box-shadow:inset 0 1px 2px rgba(255,255,255,.5),0 7px 14px rgba(80,91,178,.18); }.catalog-group--inactive .course-orb { background:linear-gradient(135deg,#9b93ae,#6b9cad); }.catalog-group--deleted .course-row { opacity:.72; }.catalog-group--deleted .course-orb { background:linear-gradient(135deg,#a57f91,#8e8a9d); }.course-row strong,.course-row small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.course-row small { display:block; margin-top:3px; color:var(--muted); font-size:11px; font-weight:500; }
    .studio { min-width:0; padding:20px; }.empty { display:grid; min-height:520px; place-items:center; text-align:center; color:var(--muted); }.empty div { max-width:420px; }.empty h2 { color:var(--ink); margin-bottom:8px; }.studio-head { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:18px; }.studio-head h2 { margin:0; font-size:22px; }.studio-head p { margin:5px 0 0; color:var(--muted); font-size:12px; }.head-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:end; }.steps { display:flex; gap:7px; margin-bottom:18px; overflow:auto; padding-bottom:2px; }.step { flex:1 0 132px; padding:10px; border:1px solid var(--line); border-radius:14px; color:var(--muted); font-size:12px; background:rgba(255,255,255,.35); }.step b { display:block; color:var(--ink); margin-bottom:3px; }.step.current { border-color:rgba(62,165,180,.4); background:rgba(238,255,255,.48); }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }.form-grid .wide { grid-column:1/-1; }label { display:grid; gap:6px; color:#655b78; font-size:12px; font-weight:800; }input,textarea,select { width:100%; min-width:0; border:1px solid rgba(119,96,158,.2); border-radius:13px; padding:10px 11px; color:var(--ink); outline:none; background:rgba(255,255,255,.72); box-shadow:inset 0 1px 0 rgba(255,255,255,.7); }textarea { min-height:88px; resize:vertical; line-height:1.8; direction:rtl; }input:focus,textarea:focus,select:focus { border-color:rgba(57,154,191,.62); box-shadow:0 0 0 3px rgba(57,154,191,.11); }.form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
    .level-choice { display:flex; min-height:44px; gap:4px; padding:4px; border:1px solid rgba(255,255,255,.78); border-radius:15px; background:rgba(255,255,255,.36); box-shadow:inset 0 1px 0 rgba(255,255,255,.86),0 7px 16px rgba(89,74,132,.05); }.level-choice button { flex:1 1 0; min-width:0; min-height:34px; padding:0 8px; border:1px solid transparent; border-radius:11px; color:#756b88; background:transparent; box-shadow:none; font-size:12px; }.level-choice button:hover:not(:disabled) { transform:none; filter:none; color:#4c426a; background:rgba(255,255,255,.5); }.level-choice button[aria-pressed="true"] { color:white; border-color:rgba(255,255,255,.66); background:linear-gradient(135deg,#8261dc,#50b4cf); box-shadow:0 6px 13px rgba(86,75,177,.24),inset 0 1px 0 rgba(255,255,255,.44); }.level-choice button:disabled { cursor:not-allowed; opacity:.5; }
    .section-title { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:25px 0 10px; }.section-title h3 { margin:0; font-size:16px; }.pill { padding:5px 9px; border:1px solid var(--line); border-radius:999px; color:#62597d; background:rgba(255,255,255,.5); font-size:11px; }.pill.published { color:#12765d; border-color:rgba(32,155,119,.25); background:rgba(224,255,244,.56); }.pill.failed { color:#a33b58; border-color:rgba(207,82,115,.28); background:rgba(255,235,242,.6); }.overview { margin:10px 0; padding:13px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.38); }.overview p { margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.9; }.module-list { display:grid; gap:9px; }.module { border:1px solid var(--line); border-radius:17px; overflow:hidden; background:rgba(255,255,255,.38); }.module summary { cursor:pointer; list-style:none; padding:13px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:900; }.module summary::-webkit-details-marker { display:none; }.module-body { padding:0 13px 13px; border-top:1px solid rgba(116,93,158,.1); }.module-body p { color:var(--muted); line-height:1.8; font-size:12px; }.stage-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:7px; }.stage-row { min-height:0; padding:9px; border-radius:12px; background:rgba(255,255,255,.58); color:var(--ink); border:1px solid rgba(114,96,159,.12); box-shadow:none; text-align:right; font-size:12px; }.stage-row:hover { transform:none; border-color:rgba(73,154,190,.44); }.stage-row small { display:block; margin-top:3px; color:var(--muted); font-weight:500; }
    dialog { width:min(760px,calc(100% - 26px)); max-height:calc(100vh - 26px); padding:0; border:1px solid rgba(255,255,255,.86); border-radius:23px; color:var(--ink); background:rgba(250,248,255,.93); box-shadow:0 25px 80px rgba(40,28,76,.27); backdrop-filter:blur(28px); }dialog::backdrop { background:rgba(42,31,66,.28); backdrop-filter:blur(4px); }.dialog-body { padding:18px; overflow:auto; max-height:calc(100vh - 26px); }.dialog-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }.dialog-head h3 { margin:0; }.dialog-head button { min-height:34px; padding:0 10px; }.error { min-height:20px; margin-top:9px; color:var(--danger); font-size:12px; }
    /* CMS uses the same liquid material as the learner app, with stronger text contrast for authoring work. */
    body.zito-glass-admin { background:var(--zito-canvas); }
    button { border:1px solid rgba(255,255,255,.62); background:var(--zito-liquid-action); box-shadow:0 12px 26px rgba(89,70,180,.22),inset 0 1px 0 rgba(255,255,255,.48); }
    button.ghost { border-color:rgba(255,255,255,.78); background:var(--zito-liquid-surface-soft); box-shadow:inset 0 1px 0 rgba(255,255,255,.84),0 7px 16px rgba(83,65,122,.06); }
    button.publish { background:linear-gradient(135deg,#3c91af,#48b4a5 58%,#7866cb); } button.danger { background:linear-gradient(135deg,#b94d69,#db6681); box-shadow:none; }
    .panel,.module,.overview,.step { border-color:rgba(255,255,255,.72); background:var(--zito-liquid-surface); box-shadow:var(--zito-liquid-shadow),inset 0 1px 0 rgba(255,255,255,.88); backdrop-filter:blur(26px) saturate(140%); }
    .course-row,.stage-row { border-color:rgba(255,255,255,.68); background:var(--zito-liquid-surface-soft); box-shadow:inset 0 1px 0 rgba(255,255,255,.78),0 7px 16px rgba(83,65,122,.05); }
    .course-row:hover,.course-row.active,.stage-row:hover { border-color:rgba(81,166,196,.54); background:var(--zito-liquid-surface-strong); box-shadow:0 10px 22px rgba(83,65,122,.10),inset 0 1px 0 rgba(255,255,255,.92); }
    input,textarea,select { border-color:rgba(255,255,255,.75); background:var(--zito-liquid-input); box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 15px rgba(89,74,132,.05); }
    input:focus,textarea:focus,select:focus { border-color:rgba(255,255,255,.96); box-shadow:0 0 0 3px rgba(77,166,198,.15),0 12px 24px rgba(106,84,164,.10),inset 0 1px 0 rgba(255,255,255,.96); }
    dialog { border-color:rgba(255,255,255,.86); background:var(--zito-liquid-surface-strong); box-shadow:var(--zito-liquid-shadow-raised); backdrop-filter:blur(32px) saturate(145%); }
    .pill { border-color:rgba(255,255,255,.72); background:rgba(255,255,255,.42); }
    @media(max-width:850px) { .workspace { grid-template-columns:1fr; }.catalog { position:static; max-height:none; }.catalog-list { display:grid; overflow:visible; gap:12px; }.catalog-group-list { display:flex; overflow-x:auto; gap:7px; padding-bottom:3px; scrollbar-width:thin; }.course-row { flex:0 0 220px; margin:0; } }@media(max-width:580px) { .shell { padding:10px; }.top,.studio { padding:14px; }.top,.studio-head { align-items:stretch; flex-direction:column; }.head-actions { justify-content:stretch; }.head-actions button { flex:1; }.form-grid { grid-template-columns:1fr; }.form-grid .wide { grid-column:auto; }.form-actions { justify-content:stretch; }.form-actions button { flex:1; }.stage-list { grid-template-columns:1fr; }.level-choice { min-height:48px; }.level-choice button { min-height:38px; font-size:11px; padding:0 5px; } }
  </style>

<body class="zito-glass zito-glass-admin">
  <div class="shell">
    <header class="top"><div class="brand"><img src="/landing-static/zito-logo.svg" alt="زیتو"><div><h1>استودیوی دوره زیتو</h1><div class="sub">تدوین، بازبینی، انتشار و آماده‌سازی دانش کوچ</div></div></div><div class="top-actions"><span id="status" class="status" aria-live="polite">در حال بارگذاری</span><button class="ghost" id="usersView">کاربران</button><button class="ghost" id="logout">خروج</button></div></header>
    <div class="workspace"><aside class="catalog panel"><div class="catalog-head"><strong>دوره‌ها و نسخه‌ها</strong><button id="newCourse">دوره جدید</button></div><div id="catalogList" class="catalog-list"></div></aside><main id="studio" class="studio panel"></main></div>
  </div>
  <dialog id="stageDialog"><form id="stageForm" class="dialog-body" method="dialog"><div class="dialog-head"><h3 id="stageDialogTitle">ویرایش ایستگاه</h3><button class="ghost" value="cancel">بستن</button></div><label>عنوان ایستگاه<input id="stageTitle" required></label><label>محتوا (JSON)<textarea id="stageContent" spellcheck="false" dir="ltr" required></textarea></label><label>تنظیمات ارزیابی خصوصی (JSON، فقط برای آزمونک)<textarea id="stageEvaluation" spellcheck="false" dir="ltr"></textarea></label><div class="form-actions"><button id="saveStage" type="button">ذخیره تغییرات</button></div><div id="stageError" class="error"></div></form></dialog>
  <dialog id="moduleDialog"><form class="dialog-body" method="dialog"><div class="dialog-head"><h3 id="moduleDialogTitle">ویرایش سرفصل</h3><button class="ghost" value="cancel">بستن</button></div><label>عنوان سرفصل<input id="moduleTitle" required></label><label>توضیح سرفصل<textarea id="moduleDescription" required></textarea></label><label>هدف‌های یادگیری (هر هدف در یک خط)<textarea id="moduleObjectives" required></textarea></label><label>تگ‌ها (هر تگ در یک خط)<textarea id="moduleTags"></textarea></label><div class="form-actions"><button id="saveModule" type="button">ذخیره سرفصل</button></div><div id="moduleError" class="error"></div></form></dialog>
  <dialog id="usersDialog"><div class="dialog-body"><div class="dialog-head"><h3>مدیریت کاربران</h3><button class="ghost" id="closeUsers">بستن</button></div><div id="usersList" class="module-list"></div></div></dialog>
  <script>
    const studio=document.querySelector('#studio'),catalogList=document.querySelector('#catalogList'),statusNode=document.querySelector('#status'),stageDialog=document.querySelector('#stageDialog'),moduleDialog=document.querySelector('#moduleDialog');let courses=[],active=null,activeStage=null,activeModule=null,courseRequestSequence=0,generationPollSequence=0,lifecyclePending=false;
    const escapeHtml=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');const setStatus=(message,bad=false)=>{statusNode.textContent=message;statusNode.style.color=bad?'var(--danger)':'';};function apiErrorDetail(detail){if(typeof detail==='string')return detail;if(Array.isArray(detail))return detail.map(item=>item?.msg).filter(Boolean).join('، ');return 'عملیات ناموفق بود.';}async function api(path,options={}){let response;try{response=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});}catch(cause){const error=new Error('ارتباط با سرور لحظه‌ای قطع شد؛ دوباره در حال تلاش هستیم.');error.networkFailure=true;error.cause=cause;throw error;}if(response.status===401){location.href='/admin/login';throw new Error('نشست مدیریت پایان یافت.');}const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(apiErrorDetail(body.detail));return body;}function generationLabel(course){const labels={not_requested:'آماده تولید',generating:'در حال تولید',generated:'نیازمند بازبینی',edited:'ویرایش‌شده',needs_regeneration:'نیازمند تولید مجدد',published:'منتشرشده',failed:'تولید ناموفق'};return labels[course.generation_status]||course.generation_status;}
    function courseStatusLabel(status){return({draft:'پیش‌نویس',published:'فعال',inactive:'غیرفعال',deleted:'حذف‌شده'})[status]||status;}
    function renderCatalog(){if(!courses.length){catalogList.innerHTML='<div class="sub">هنوز دوره‌ای ساخته نشده است.</div>';return;}const groups=[{key:'active',label:'فعال',items:courses.filter(course=>!['inactive','deleted'].includes(course.course_status))},{key:'inactive',label:'غیرفعال',items:courses.filter(course=>course.course_status==='inactive')},{key:'deleted',label:'حذف‌شده',items:courses.filter(course=>course.course_status==='deleted')}];const row=course=>`<button class="course-row ${active?.id===course.id?'active':''}" data-course-id="${course.course_id}" data-version="${course.version_number}"><span class="course-orb">Z</span><span><strong>${escapeHtml(course.course_title)}</strong><small>${escapeHtml(courseStatusLabel(course.course_status))} · نسخه ${course.version_number} · ${escapeHtml(generationLabel(course))}</small></span></button>`;catalogList.innerHTML=groups.map(group=>`<section class="catalog-group catalog-group--${group.key}" data-catalog-group="${group.key}"><div class="catalog-group-head"><span>${group.label}</span><span class="catalog-group-count">${group.items.length}</span></div><div class="catalog-group-list">${group.items.length?group.items.map(row).join(''):'<div class="catalog-empty">موردی در این بخش نیست.</div>'}</div></section>`).join('');catalogList.querySelectorAll('[data-course-id]').forEach(button=>button.onclick=()=>openCourse(Number(button.dataset.courseId),Number(button.dataset.version)));}
    function createForm(){active=null;renderCatalog();studio.innerHTML=`<div class="studio-head"><div><h2>شروع یک دوره جدید</h2><p>اطلاعات اولیه را وارد کن؛ زیتو پیش‌نویس کامل سرفصل‌ها و ۸ ایستگاه ثابت آموزش را می‌سازد.</p></div></div><form id="briefForm"><div class="form-grid"><label>نام دوره<input name="title" required maxlength="255"></label><label>موضوع دوره<input name="topic" required></label><label class="wide">هدف دوره<textarea name="goal" required></textarea></label><label>مدت دوره<input name="duration" required placeholder="مثلاً ۴ هفته، روزی ۳۰ دقیقه"></label><label>ساعت یادگیری موردنیاز<input name="estimated_learning_hours" type="number" min="1" max="1000" value="12" required></label><label>مخاطب دوره<input name="audience" required></label><label>گروه هدف<input name="target_group" required></label><label>سطح دوره<select name="level"><option>مقدماتی</option><option>متوسط</option><option>پیشرفته</option></select></label><label>تعداد سرفصل<input name="module_count" type="number" min="1" max="20" value="5" required></label><label>دامنه داخلی (اختیاری)<input name="domain" placeholder="مثلاً product_management"></label><label class="wide">آدرس انگلیسی دوره (اختیاری)<input name="slug" dir="ltr" placeholder="product-management"></label></div><div class="form-actions"><button type="submit">ساخت پیش‌نویس دوره</button></div><div id="briefError" class="error"></div></form>`;document.querySelector('#briefForm').onsubmit=submitCreate;}
    async function submitCreate(event){event.preventDefault();const form=event.currentTarget, error=form.querySelector('#briefError'),button=form.querySelector('button[type=submit]');error.textContent='';button.disabled=true;try{const data=Object.fromEntries(new FormData(form));data.module_count=Number(data.module_count);data.estimated_learning_hours=Number(data.estimated_learning_hours);data.client_request_id=globalThis.crypto?.randomUUID?.()||`cms-${Date.now()}-${Math.random().toString(16).slice(2)}`;let course;for(let attempt=1;attempt<=3;attempt+=1){try{course=await api('/api/admin/courses',{method:'POST',body:JSON.stringify(data)});break;}catch(requestError){if(!requestError.networkFailure||attempt===3)throw requestError;setStatus(`ارتباط قطع شد؛ تلاش مجدد ${attempt} از ۲…`,true);await wait(attempt*900);}}await loadCourses(course.course_id,course.version_number);setStatus('پیش‌نویس ساخته شد. حالا تولید AI را شروع کن.');}catch(error){form.querySelector('#briefError').textContent=error.networkFailure?'ارتباط با سرور برقرار نشد. اینترنت را بررسی کن و دوباره بزن؛ اطلاعات فرم حفظ شده است.':error.message;setStatus('ساخت پیش‌نویس کامل نشد.',true);}finally{button.disabled=false;}}
    function renderModules(modules,readOnly=false){if(!modules.length)return '<div class="empty"><div><h2>پیش‌نویس هنوز محتوا ندارد</h2><p>بعد از تولید AI، هر سرفصل شامل مسیر یادگیری، خلاصه، فلش‌کارت، تمرین، آزمونک و پایان سرفصل می‌شود.</p></div></div>';return modules.map((module,index)=>`<details class="module" ${index===0?'open':''}><summary><span>سرفصل ${module.module_number}: ${escapeHtml(module.title)}</span><span class="pill">${module.stages.length} ایستگاه</span></summary><div class="module-body"><p>${escapeHtml(module.description||'')}</p>${readOnly?'':`<div class="form-actions"><button class="ghost" type="button" data-module-id="${module.id}">ویرایش سرفصل</button></div>`}<div class="stage-list">${module.stages.map(stage=>`<button class="stage-row" data-stage-id="${stage.id}" ${readOnly?'disabled':''}><strong>${stage.stage_number}. ${escapeHtml(stage.title)}</strong><small>${escapeHtml(stage.template_code)}</small></button>`).join('')}</div></div></details>`).join('');}
    function renderStudio(){if(!active){createForm();return;}const brief=active.authoring_brief||{},canGenerate=active.status!=='published',isPublished=active.status==='published',publishBlocked=['not_requested','generating','needs_regeneration','failed'].includes(active.generation_status)||!active.modules.length;studio.innerHTML=`<div class="studio-head"><div><h2>${escapeHtml(active.course_title)}</h2><p>نسخه ${active.version_number} · <span class="pill ${active.generation_status==='published'?'published':active.generation_status==='failed'?'failed':''}">${escapeHtml(generationLabel(active))}</span></p></div><div class="head-actions">${canGenerate?`<button id="generateCourse">${active.generation_status==='failed'?'تلاش دوباره تولید با AI':active.modules.length?'تولید مجدد با AI':'تولید دوره با AI'}</button>`:''}${canGenerate?`<button class="publish" id="publishCourse" ${publishBlocked?'disabled title="ابتدا تولید AI را کامل کن"':''}>انتشار دوره</button>`:''}${isPublished?'<button id="createRevision">ویرایش با نسخه جدید</button>':''}<a href="/app/courses/${encodeURIComponent(active.course_slug)}" target="_blank"><button class="ghost" type="button">پیش‌نمایش لندینگ</button></a></div></div><div class="steps"><div class="step ${!active.modules.length?'current':''}"><b>۱. brief</b>مشخصات دوره</div><div class="step ${active.modules.length?'current':''}"><b>۲. محتوا</b>سرفصل و ایستگاه</div><div class="step ${isPublished?'current':''}"><b>۳. انتشار</b>لندینگ و آموزش</div><div class="step ${isPublished?'current':''}"><b>۴. RAG</b>صف دانش کوچ</div></div><section class="overview"><strong>هدف: ${escapeHtml(brief.goal||'—')}</strong><p>${escapeHtml(active.overview?.description||'پس از تولید، معرفی دوره و خروجی‌ها اینجا نمایش داده می‌شود.')}</p></section><div class="section-title"><h3>چارچوب تدوین</h3><span class="pill">${brief.module_count||'—'} سرفصل · ${active.module_stage_count||8} ایستگاه</span></div><form id="briefForm"><div class="form-grid"><label>نام دوره<input name="title" value="${escapeHtml(brief.title||active.course_title)}" ${isPublished?'disabled':''} required></label><label>موضوع دوره<input name="topic" value="${escapeHtml(brief.topic||'')}" ${isPublished?'disabled':''} required></label><label class="wide">هدف دوره<textarea name="goal" ${isPublished?'disabled':''} required>${escapeHtml(brief.goal||'')}</textarea></label><label>مدت دوره<input name="duration" value="${escapeHtml(brief.duration||'')}" ${isPublished?'disabled':''} required></label><label>ساعت یادگیری<input name="estimated_learning_hours" type="number" min="1" value="${escapeHtml(brief.estimated_learning_hours||'')}" ${isPublished?'disabled':''} required></label><label>مخاطب<input name="audience" value="${escapeHtml(brief.audience||'')}" ${isPublished?'disabled':''} required></label><label>گروه هدف<input name="target_group" value="${escapeHtml(brief.target_group||'')}" ${isPublished?'disabled':''} required></label><label>سطح دوره<input name="level" value="${escapeHtml(brief.level||'')}" ${isPublished?'disabled':''} required></label><label>تعداد سرفصل<input name="module_count" type="number" min="1" max="20" value="${escapeHtml(brief.module_count||'')}" ${isPublished?'disabled':''} required></label><label>ایستگاه هر سرفصل<select name="module_stage_count" ${isPublished?'disabled':''}>${[7,8,9].map(n=>`<option value="${n}" ${Number(active.module_stage_count)===n?'selected':''}>${n} ایستگاه</option>`).join('')}</select></label></div>${isPublished?'':'<div class="form-actions"><button class="ghost" type="submit">ذخیره چارچوب</button></div>'}</form><div id="briefError" class="error">${active.generation_error?escapeHtml(active.generation_error):''}</div><div class="section-title"><h3>سرفصل‌ها و ایستگاه‌ها</h3><span class="pill">${active.modules.length} سرفصل</span></div><div class="module-list">${renderModules(active.modules,isPublished)}</div>`;document.querySelector('#briefForm').onsubmit=saveBrief;document.querySelector('#generateCourse')?.addEventListener('click',ge     async function saveBrief(event){event.preventDefault();if(active.status==='published')return;const data=Object.fromEntries(new FormData(event.currentTarget));['module_count','estimated_learning_hours'].forEach(key=>data[key]=Number(data[key]));try{const course=await api(`/api/admin/courses/${active.course_id}/versions/${active.version_number}/brief`,{method:'PATCH',body:JSON.stringify(data)});replaceActive(course);setStatus('چارچوب ذخیره شد؛ برای اعمال تغییر در محتوا، دوباره تولید کن.');}catch(error){document.querySelector('#briefError').textContent=error.message;}}
    const wait=milliseconds=>new Promise(resolve=>window.setTimeout(resolve,milliseconds));async function monitorGeneration(courseId,versionNumber){const pollSequence=++generationPollSequence;setStatus('تولید AI در پس‌زمینه ادامه دارد؛ می‌توانی در همین صفحه منتظر بمانی.');for(let attempt=0;attempt<600;attempt+=1){await wait(3000);if(pollSequence!==generationPollSequence||active?.course_id!==courseId||active?.version_number!==versionNumber)return;try{const course=await api(`/api/admin/courses/${courseId}/versions/${versionNumber}`);if(pollSequence!==generationPollSequence)return;replaceActive(course);if(course.generation_status==='generated'){setStatus('پیش‌نویس دوره آماده بازبینی است.');return;}if(course.generation_status==='failed'){setStatus(course.generation_error||'تولید دوره کامل نشد؛ دوباره تلاش کن.',true);return;}setStatus('زیتو در حال تدوین سرفصل‌ها و ایستگاه‌هاست…');}catch(error){setStatus('ارتباط لحظه‌ای قطع شد؛ وضعیت تولید دوباره بررسی می‌شود.',true);}}setStatus('تولید بیش از حد معمول طول کشیده؛ صفحه را تازه کن تا وضعیت نهایی را ببینی.',true);}async function generateCourse(){if(!confirm('محتوای فعلی این draft با نسخه تازه AI جایگزین می‌شود. ادامه می‌دهی؟'))return;const target={courseId:active.course_id,versionNumber:active.version_number};const button=document.querySelector('#generateCourse');button.disabled=true;setStatus('در حال ثبت درخواست تولید…');try{const course=await api(`/api/admin/courses/${target.courseId}/versions/${target.versionNumber}/generate`,{method:'POST'});replaceActive(course);void monitorGeneration(target.courseId,target.versionNumber);}catch(error){setStatus(error.message,true);await openCourse(target.courseId,target.versionNumber);}finally{button.disabled=false;}}
    async function publishCourse(){if(!active.modules.length){setStatus('ابتدا محتوای دوره را تولید کن.',true);return;}if(!confirm('این نسخه برای کاربران منتشر می‌شود و KB آن وارد صف RAG می‌شود. ادامه می‌دهی؟'))return;const button=document.querySelector('#publishCourse');button.disabled=true;try{const result=await api(`/api/admin/courses/${active.course_id}/versions/${active.version_number}/publish`,{method:'POST'});replaceActive(result.course);setStatus(`دوره منتشر شد؛ ${result.index_changes} تغییر در صف دانش کوچ قرار گرفت.`);}catch(error){setStatus(error.message,true);}finally{button.disabled=false;}}async function createRevision(){try{const course=await api(`/api/admin/courses/${active.course_id}/revisions`,{method:'POST'});await loadCourses(course.course_id,course.version_number);setStatus('نسخه جدید برای ویرایش ساخته شد؛ نسخه قبلی همچنان برای دانشجوها محفوظ است.');}catch(error){setStatus(error.message,true);}}
    function openStage(id){activeStage=active.modules.flatMap(module=>module.stages).find(stage=>stage.id===id);if(!activeStage)return;document.querySelector('#stageDialogTitle').textContent=`ویرایش: ${activeStage.title}`;document.querySelector('#stageTitle').value=activeStage.title;document.querySelector('#stageContent').value=JSON.stringify(activeStage.content,null,2);document.querySelector('#stageEvaluation').value=activeStage.evaluation_config?JSON.stringify(activeStage.evaluation_config,null,2):'';document.querySelector('#stageError').textContent='';stageDialog.showModal();}

    document.querySelector('#saveStage').onclick=async()=>{if(!activeStage)return;const error=document.querySelector('#stageError');try{const content=JSON.parse(document.querySelector('#stageContent').value),rawEvaluation=document.querySelector('#stageEvaluation').value.trim(),payload={title:document.querySelector('#stageTitle').value.trim(),content};if(rawEvaluation)payload.evaluation_config=JSON.parse(rawEvaluation);const course=await api(`/api/admin/courses/${active.course_id}/versions/${active.version_number}/stages/${activeStage.id}`,{method:'PATCH',body:JSON.stringify(payload)});stageDialog.close();replaceActive(course);setStatus('ایستگاه ویرایش شد.');}catch(err){error.textContent=err instanceof SyntaxError?'JSON محتوا معتبر نیست.':err.message;}};
    document.querySelector('#saveModule').onclick=async()=>{if(!activeModule)return;const error=document.querySelector('#moduleError');const toLines=value=>value.split('\n').map(item=>item.trim()).filter(Boolean);try{const payload={title:document.querySelector('#moduleTitle').value.trim(),description:document.querySelector('#moduleDescription').value.trim(),learning_objectives:toLines(document.querySelector('#moduleObjectives').value),tags:toLines(document.querySelector('#moduleTags').value)};const course=await api(`/api/admin/courses/${active.course_id}/versions/${active.version_number}/modules/${activeModule.id}`,{method:'PATCH',body:JSON.stringify(payload)});moduleDialog.close();replaceActive(course);setStatus('سرفصل ویرایش شد.');}catch(err){error.textContent=err.message;}};
    function mergeCourseState(course){let matched=false;courses=courses.map(item=>{if(item.course_id!==course.course_id)return item;if(item.id===course.id){matched=true;return course;}return{...item,course_status:course.course_status};});if(!matched)courses.unshift(course);}function replaceActive(course){mergeCourseState(course);active=course;renderCatalog();renderStudio();}async function openCourse(courseId,version){const requestSequence=++courseRequestSequence;generationPollSequence+=1;try{setStatus('در حال دریافت نسخه دوره…');const course=await api(`/api/admin/courses/${courseId}/versions/${version}`);if(requestSequence!==courseRequestSequence)return;replaceActive(course);if(course.generation_status==='generating'){void monitorGeneration(course.course_id,course.version_number);}else{setStatus('');}}catch(error){if(requestSequence===courseRequestSequence)setStatus(error.message,true);}}async function loadCourses(selectCourseId,selectVersion){try{courses=await api('/api/admin/courses');renderCatalog();if(selectCourseId){await openCourse(selectCourseId,selectVersion);}else if(active){await openCourse(active.course_id,active.version_number);}else{createForm();}if(active?.generation_status!=='generating')setStatus('');}catch(error){setStatus(error.message,true);studio.innerHTML='<div class="empty"><div><h2>دسترسی به استودیو ممکن نیست</h2><p>صفحه را دوباره بارگذاری کن.</p></div></div>';}}
    async function loadUsers(){const users=await api('/api/admin/users');const list=document.querySelector('#usersList');list.innerHTML=users.map(user=>`<article class="module"><div class="module-body" style="padding-top:13px"><strong>${escapeHtml(user.display_name)}</strong><p>${escapeHtml(user.phone)} · ${escapeHtml(user.education_level||'پروفایل تکمیل نشده')}</p><p>${escapeHtml(user.learning_goal_interests||'هدف یادگیری ثبت نشده')}</p><div class="form-actions">${user.blocked_at?`<button class="ghost" data-unblock="${user.id}">رفع مسدودیت</button>`:`<button class="ghost" data-block="${user.id}">مسدود کردن</button>`}</div></div></article>`).join('')||'<div class="sub">کاربری ثبت نشده است.</div>';list.querySelectorAll('[data-block]').forEach(button=>button.onclick=()=>blockUser(button.dataset.block));list.querySelectorAll('[data-unblock]').forEach(button=>button.onclick=()=>unblockUser(button.dataset.unblock));}

    function ragStatusLabel(status){return({queued:'در صف ایندکس',indexing:'در حال ایندکس',ready:'دانش کوچ آماده است',failed:'ایندکس ناموفق',not_published:'هنوز منتشر نشده'})[status]||status;}
    async function refreshRagStatus(){if(!active||active.status!=='published')return;const courseId=active.course_id,versionNumber=active.version_number,key=`${courseId}:${versionNumber}`;let section=document.querySelector('#ragStatus');if(!section){section=document.createElement('section');section.id='ragStatus';section.className='overview';section.dataset.loadedFor='';const steps=studio.querySelector('.steps');if(!steps)return;steps.insertAdjacentElement('afterend',section);}if(section.dataset.loadedFor===key)return;section.dataset.loadedFor=key;section.innerHTML='<strong>دانش کوچ</strong><p>در حال بررسی وضعیت ایندکس این نسخه…</p>';try{const rag=await api(`/api/admin/courses/${courseId}/versions/${versionNumber}/rag-status`);if(!active||active.course_id!==courseId||active.version_number!==versionNumber)return;const detail=rag.status==='ready'?`${rag.succeeded_job_count} منبع آماده پاسخ‌گویی است.`:rag.status==='failed'?`یک یا چند منبع ناموفق بود.${rag.last_error?` ${escapeHtml(rag.last_error)}`:''}`:`${rag.queued_job_count+rag.running_job_count+rag.retry_job_count} منبع در صف یا حال پردازش است.`;section.innerHTML=`<strong>${escapeHtml(ragStatusLabel(rag.status))}</strong><p>${detail}</p>`;}catch(error){section.dataset.loadedFor='';section.innerHTML='<strong>دانش کوچ</strong><p>وضعیت ایندکس فعلاً در دسترس نیست.</p>';}}
    function bindGenerationInstructions(root=document){const form=root.querySelector('#briefForm');if(!form||form.querySelector('[name="generation_instructions"]'))return;const goal=form.querySelector('[name="goal"]')?.closest('label');if(!goal)return;const label=document.createElement('label');label.className='wide generation-instructions';label.textContent='توضیحات تکمیلی برای هوش مصنوعی (اختیاری)';const textarea=document.createElement('textarea');textarea.name='generation_instructions';textarea.maxLength=6000;textarea.rows=6;textarea.placeholder='مثلاً رویکرد آموزشی، موضوعات ضروری، محدودیت‌ها، مثال‌های موردنظر و لحن دوره را برای AI بنویس.';textarea.value=active?.authoring_brief?.generation_instructions||'';textarea.disabled=active?.status==='published';const hint=document.createElement('small');hint.textContent='این متن مستقیماً در تدوین معرفی دوره، سرفصل‌ها، درس‌ها، نکات، فلش‌کارت‌ها و آزمونک‌ها استفاده می‌شود.';label.append(textarea,hint);goal.insertAdjacentElement('afterend',label);}

    function bindLevelChoices(root=document){root.querySelectorAll('select[name="module_stage_count"]').forEach(control=>control.closest('label')?.remove());root.querySelectorAll('select[name="level"],input[name="level"]').forEach(control=>{const label=control.closest('label');if(!label||label.querySelector('[data-level-choice]'))return;const disabled=control.disabled;let input=control;if(control.tagName==='SELECT'){input=document.createElement('input');input.type='hidden';input.name='level';input.value=control.value||courseLevels[0];input.disabled=disabled;control.replaceWith(input);}else{input.type='hidden';}const choices=document.createElement('span');choices.className='level-choice';choices.dataset.levelChoice='';const selectLevel=value=>{input.value=value;choices.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.levelValue===value)));};courseLevels.forEach(level=>{const button=document.createElement('button');button.type='button';button.dataset.levelValue=level;button.textContent=level;button.disabled=disabled;button.setAttribute('aria-pressed',String(input.value===level));button.addEventListener('click',()=>selectLevel(level));choices.append(button);});if(!courseLevels.includes(input.value))input.value=courseLevels[0];selectLevel(input.value);label.append(choices);});}
    function renderCourseLifecycleControls(){const actions=studio.querySelector('.head-actions');if(!active||!actions||actions.querySelector('[data-course-action]'))return;const status=active.course_status;if(status!=='published')actions.querySelector('a[href^="/app/courses/"]')?.remove();if(status!=='published')actions.querySelector('#createRevision')?.remove();if(status==='deleted'){actions.querySelector('#generateCourse')?.remove();actions.querySelector('#publishCourse')?.remove();}const buttons=status==='published'&&active.status==='published'?'<button class="ghost" type="button" data-course-action="deactivate">غیرفعال‌سازی دوره</button><button class="danger" type="button" data-course-action="soft-delete">حذف دوره</button>':status==='inactive'?'<button type="button" data-course-action="reactivate">فعال‌سازی دوره</button><button class="danger" type="button" data-course-action="soft-delete">حذف دوره</button>':status==='deleted'?'<button type="button" data-course-action="restore">بازیابی دوره</button>':'<button class="danger" type="button" data-course-action="soft-delete">حذف دوره</button>';actions.insertAdjacentHTML('beforeend',buttons);actions.querySelectorAll('[data-course-action]').forEach(button=>button.onclick=event=>{event.preventDefault();event.stopPropagation();void changeCourseVisibility(button.dataset.courseAction);});}
    async function changeCourseVisibility(action){if(!active||lifecyclePending)return;const target={courseId:active.course_id,versionNumber:active.version_number,versionId:active.id,title:active.course_title};const labels={deactivate:'غیرفعال‌سازی',reactivate:'فعال‌سازی',"soft-delete":'حذف نرم',restore:'بازیابی'};if(!confirm(`از ${labels[action]} دوره «${target.title}» مطمئنی؟`))return;lifecyclePending=true;studio.querySelectorAll('[data-course-action]').forEach(button=>button.disabled=true);try{const course=await api(`/api/admin/courses/${target.courseId}/versions/${target.versionNumber}/${action}`,{method:'POST'});lifecyclePending=false;const selectionUnchanged=active?.id===target.versionId;mergeCourseState(course);if(selectionUnchanged){active=course;renderStudio();}renderCatalog();setStatus(`دوره «${target.title}» با موفقیت ${labels[action]} شد.`);}catch(error){setStatus(error.message,true);}finally{lifecyclePending=false;studio.querySelectorAll('[data-course-action]').forEach(button=>button.disabled=false);}}
    new MutationObserver(()=>{bindGenerationInstructions(studio);bindLevelChoices(studio);renderCourseLifecycleControls();void refreshRagStatus();}).observe(studio,{childList:true,subtree:false});window.setInterval(()=>{const section=document.querySelector('#ragStatus');if(section)section.dataset.loadedFor='';void refreshRagStatus();},15000);
    document.querySelector('#newCourse').onclick=createForm;document.querySelector('#usersView').onclick=async()=>{try{await loadUsers();document.querySelector('#usersDialog').showModal();}catch(error){setStatus(error.message,true);}};document.querySelector('#closeUsers').onclick=()=>document.querySelector('#usersDialog').close();document.querySelector('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='/admin/login';};loadCourses();
  </script>
</body>
