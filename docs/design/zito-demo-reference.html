ai-m1`,title:`هوش مصنوعی چیست و چه نیست`,tag:`پایه`,description:`مدل‌های زبانی متن را پیش‌بینی می‌کنند، نه اینکه «بدانند». با فهم همین نکته، می‌فهمی کجا به آن‌ها اعتماد کنی و کجا نه.`,objectives:[`تفاوت پیش‌بینی متن با دانستن را توضیح دهی`,`سه کار مناسب و سه کار نامناسب برای هوش مصنوعی را نام ببری`,`خطر ساختن اطلاعات نادرست را بشناسی`],path:[{title:`مدل زبانی`,text:`چطور جمله را کامل می‌کند.`},{title:`نقاط قوت`,text:`خلاصه، پیش‌نویس، ایده.`},{title:`نقاط ضعف`,text:`عدد، منبع، اطلاعات تازه.`},{title:`قاعده‌ی اعتماد`,text:`بررسی قبل از استفاده.`}],summary:[{title:`پیش‌بینی، نه دانستن`,text:`مدل زبانی از میلیاردها جمله یاد گرفته که کدام کلمه معمولاً بعد از کدام می‌آید. جواب‌هایش روان است چون الگوی زبان را خوب می‌شناسد، نه چون حقیقت را چک کرده. برای همین ممکن است با اطمینان کامل چیزی نادرست بگوید.`},{title:`کجا خوب است`,text:`خلاصه کردن متن طولانی، نوشتن پیش‌نویس ایمیل، پیشنهاد ایده و بازنویسی با لحن دیگر. در این کارها اگر اشتباهی هم باشد، تو آن را می‌بینی و درست می‌کنی.`},{title:`کجا مراقب باشی`,text:`عدد و آمار، نام منبع و قانون، و اطلاعات خیلی تازه. در این موارد مدل ممکن است جزئیات بسازد. هر عدد یا منبعی که از هوش مصنوعی می‌گیری را قبل از استفاده بررسی کن.`}],worked:`نیلوفر از هوش مصنوعی می‌خواهد گزارش جلسه‌ی دوساعته را در ده خط خلاصه کند. خلاصه عالی است، ولی یک تاریخ تحویل اشتباه در آن آمده. چون نیلوفر در جلسه بوده، خطا را می‌بیند و اصلاح می‌کند. درس: هوش مصنوعی وقت را نجات داد، ولی مسئولیت بررسی با خود او ماند.`,recap:[{title:`روان ≠ درست`,text:`جواب روان را با جواب درست اشتباه نگیر.`},{title:`کارهای مناسب`,text:`خلاصه، پیش‌نویس، ایده، بازنویسی.`},{title:`بررسی`,text:`عدد و منبع را همیشه چک کن.`}],flashcards:[{front:`مدل زبانی در اصل چه کاری می‌کند؟`,back:`کلمه‌ی بعدی را پیش‌بینی می‌کند.`},{front:`یک کار مناسب برای هوش مصنوعی`,back:`خلاصه کردن متن طولانی.`},{front:`یک کار پرخطر بدون بررسی`,back:`استفاده از عدد و منبع پیشنهادی آن.`},{front:`مسئولیت نهایی خروجی با کیست؟`,back:`با کسی که از آن استفاده می‌کند.`}],tips:[{title:`از آن پیش‌نویس بخواه، نه نسخه‌ی نهایی`,text:`پیش‌نویس را خودت ویرایش کن.`},{title:`اطلاعات محرمانه وارد نکن`,text:`شماره‌ی مشتری و قرارداد را حذف یا جایگزین کن.`},{title:`از آن بپرس از کجا مطمئن است`,text:`اگر منبع نداد، جواب را فرضیه بدان.`}],mistakes:[{mistake:`کپی مستقیم عدد و آمار در گزارش`,fix:`هر عدد را با منبع اصلی تطبیق بده.`},{mistake:`وارد کردن اطلاعات شخصی مشتری`,fix:`نام‌ها و شماره‌ها را با نمونه جایگزین کن.`},{mistake:`نتیجه گرفتن از یک بار پرسیدن`,fix:`سؤال را دوباره با زاویه‌ی دیگر بپرس و جواب‌ها را مقایسه کن.`}],framework:[{title:`نوع کار`,text:`خلاصه، پیش‌نویس یا ایده است؟`},{title:`خطر خطا`,text:`اگر اشتباه باشد چه می‌شود؟`},{title:`بررسی`,text:`کدام بخش را باید چک کنم؟`},{title:`مسئولیت`,text:`نسخه‌ی نهایی را خودم تأیید می‌کنم.`}],quiz:[{text:`کدام کار برای سپردن به هوش مصنوعی کم‌خطرتر است؟`,options:[`نوشتن پیش‌نویس ایمیل پیگیری که خودت ویرایش می‌کنی`,`تعیین نرخ مالیات قرارداد`,`نوشتن آمار فروش ماه قبل از حافظه‌ی مدل`,`نام بردن قانون مرتبط بدون بررسی`]},{text:`چرا هوش مصنوعی گاهی با اطمینان چیز نادرست می‌گوید؟`,options:[`چون متن را پیش‌بینی می‌کند و حقیقت را بررسی نمی‌کند`,`چون عمداً دروغ می‌گوید`,`چون اینترنتش قطع است`,`چون سؤال فارسی بوده`]},{text:`گزارش هوش مصنوعی یک آمار دارد. قدم درست کدام است؟`,options:[`آمار را با منبع اصلی تطبیق بدهی`,`آمار را حذف نکنی چون دقیق به نظر می‌رسد`,`از مدل بخواهی آمار را گرد کند`,`آمار را بدون منبع منتشر کنی`]}],completion:`حالا می‌دانی هوش مصنوعی ابزار پیش‌بینی متن است: سریع و مفید، ولی نیازمند بررسی.`,checklist:[`سه کار تکراری خودت را که هوش مصنوعی می‌تواند پیش‌نویسش کند بنویس`,`یک قاعده‌ی شخصی برای بررسی عدد و منبع بنویس`]},{id:`ai-m2`,title:`نوشتن درخواست خوب`,tag:`کاربردی`,description:`کیفیت جواب به کیفیت درخواست بستگی دارد. با چهار جزء نقش، زمینه، کار و قالب، درخواستی می‌نویسی که از بار اول جواب به‌دردبخور بدهد.`,objectives:[`چهار جزء درخواست خوب را به کار ببری`,`با مثال، لحن و قالب خروجی را مشخص کنی`,`درخواست ضعیف را در دو قدم بهتر کنی`],path:[{title:`نقش`,text:`از چه دیدی جواب بدهد.`},{title:`زمینه`,text:`مخاطب و موقعیت.`},{title:`کار`,text:`دقیقاً چه بسازد.`},{title:`قالب`,text:`طول، لحن و شکل خروجی.`}],summary:[{title:`چهار جزء`,text:`درخواست خوب چهار بخش دارد: نقش (مثلاً «یک کارشناس پشتیبانی باتجربه»)، زمینه (مشتری عصبانی است چون سفارش دیر رسیده)، کار (یک پاسخ عذرخواهی بنویس) و قالب (حداکثر پنج جمله، لحن محترمانه و گرم). هر جزء که نباشد، مدل خودش حدس می‌زند.`},{title:`مثال بده`,text:`یک نمونه از خروجی دلخواه، از ده توضیح بهتر کار می‌کند. اگر ایمیل‌هایت لحن خاصی دارند، یکی را به عنوان نمونه بگذار و بگو «با همین لحن».`},{title:`اصلاح در گفت‌وگو`,text:`لازم نیست بار اول کامل باشد. جواب اول را ببین و دقیق بگو چه چیزی را عوض کند: «کوتاه‌تر»، «رسمی‌تر»، «اول راه‌حل را بگو». اصلاح مشخص، سریع‌ترین راه به نتیجه است.`}],worked:`درخواست ضعیف: «یک ایمیل برای مشتری بنویس.» درخواست بهتر: «تو کارشناس پشتیبانی یک فروشگاه اینترنتی هستی. مشتری‌ای که سفارشش سه روز دیر رسیده شکایت کرده. یک ایمیل عذرخواهی بنویس که دلیل تأخیر را صادقانه بگوید و یک کد تخفیف ۱۰ درصدی پیشنهاد کند. حداکثر پنج جمله، لحن گرم و محترمانه.»`,recap:[{title:`نقش + زمینه`,text:`مدل را در موقعیت قرار بده.`},{title:`کار + قالب`,text:`دقیق بگو چه و چطور.`},{title:`اصلاح مشخص`,text:`بگو دقیقاً چه چیزی عوض شود.`}],flashcards:[{front:`چهار جزء درخواست خوب`,back:`نقش، زمینه، کار، قالب.`},{front:`بهترین راه مشخص کردن لحن`,back:`یک نمونه‌ی واقعی بگذار.`},{front:`اگر جواب اول خوب نبود؟`,back:`اصلاح مشخص بخواه، نه درخواست از نو.`},{front:`مثال قالب`,back:`«حداکثر ۵ جمله، به شکل فهرست»`}],tips:[{title:`مخاطب را بگو`,text:`«برای مدیرعامل» با «برای همکار تازه‌وارد» جواب متفاوتی می‌سازد.`},{title:`محدودیت بگذار`,text:`تعداد کلمه یا جمله، خروجی را متمرکز می‌کند.`},{title:`درخواست‌های خوب را ذخیره کن`,text:`یک فایل از درخواست‌های موفق داشته باش.`}],mistakes:[{mistake:`درخواست یک‌خطی و مبهم`,fix:`چهار جزء را اضافه کن.`},{mistake:`شروع دوباره بعد از هر جواب بد`,fix:`در همان گفت‌وگو اصلاح مشخص بخواه.`},{mistake:`ننوشتن قالب خروجی`,fix:`طول، لحن و شکل را بگو.`}],framework:[{title:`نقش`,text:`از دید چه کسی؟`},{title:`زمینه`,text:`چه اتفاقی افتاده و مخاطب کیست؟`},{title:`کار`
